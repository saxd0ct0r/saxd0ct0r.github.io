    m.describe = () => "memory only (this browser would not allow saving)";
    return { adapter: m, durable: false };
  }
}

/* ------------------------------------------------------------------ state */
const S = {
  ready: false, store: null, adapter: null, durable: true,
  pieces: [], settings: { rolloverHours: 4 }, wishlist: [],
  session: null, sessionPieces: [], endedSession: null, asideLog: [],
  cur: null, result: null, skip: new Set(),
  view: "practice", sheet: null, minutes: 15,
  form: { label: "", start: "1", end: "", tempo: "", inst: [] }, formError: "", picked: loadPicked(),
  saveError: null, exportText: "", importText: "", importMsg: "", asideNote: ""
};
const dayDate = () => core.studyDayOf(new Date(), S.settings);
const dayStr = () => dayDate().toISOString().slice(0, 10);
const live = () => S.session !== null && S.session.phase !== "ended";
const active = () => S.session !== null && S.session.phase === "active";

function workspaceState() {
  return {
    pieces: S.pieces, settings: S.settings, wishlist: S.wishlist,
    ui: S.cur ? { piece: S.cur.piece, nodeId: S.cur.node.id } : null,
    session: live() ? { session: S.session, pieces: S.sessionPieces } : null
  };
}
let saveChain = Promise.resolve();
function persist() {
  saveChain = saveChain.then(async () => {
    try {
      const r = await S.store.save(workspaceState(), { now: new Date(), studyDay: dayStr() });
      S.saveError = r.failed.length ? r.failed[0].error.message : null;
    } catch (e) { S.saveError = e.message; }
    paintTop();
  });
  return saveChain;
}

/* ---------------------------------------------------------------- helpers */
const fmtPct = step => { const p = Math.round(core.stepToPercent(step)); return p === 0 ? "0%" : (p > 0 ? "+" : "−") + Math.abs(p) + "%"; };
const fmtStep = s => (s > 0 ? "+" : s < 0 ? "−" : "") + Math.abs(s);
const rng = n => n.start === n.end ? `m. ${n.start}` : `mm. ${n.start}–${n.end}`;
const fmtDate = d => d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
const fmtClock = ms => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
function roleOf(piece, node) {
  if (node === piece.root) return "Whole piece";
  const rest = node.label.startsWith(piece.label + " — ") ? node.label.slice(piece.label.length + 3) : node.label;
  return rest.split(" — ").join(" › ");
}
function tempoFor(piece, node, step) {
  try { return pc.describeTempo(piece, node.start, node.end, step); } catch (e) { return null; }
}
function pieceOf(node) { return S.pieces.find(p => core.flattenTree(p.root).includes(node)); }
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 4200);
}
function reportEvents(events) {
  (events || []).filter(e => e.notify && e.type !== "time_up").forEach(e => toast(e.message));
}

/* ---------------------------------------------------------------- session */
/* instruments */
function loadPicked() { try { return core.normalizeInstruments(JSON.parse(localStorage.getItem("sip-picked") || "[]")); } catch (e) { return []; } }
function savePicked() { try { localStorage.setItem("sip-picked", JSON.stringify(S.picked)); } catch (e) { /* per-device convenience only */ } }
const knownInstruments = () => core.collectInstruments(S.pieces);
// The selection that applies today: only names some piece still uses, so a stale choice never hides everything.
function pickedNow() { const k = knownInstruments().map(x => x.toLowerCase()); return S.picked.filter(x => k.includes(x.toLowerCase())); }
function toggleName(list, name) {
  const has = list.some(x => x.toLowerCase() === name.toLowerCase());
  return core.normalizeInstruments(has ? list.filter(x => x.toLowerCase() !== name.toLowerCase()) : [...list, name]);
}
function instChips(selected, scope) {
  const names = core.normalizeInstruments([...knownInstruments(), ...selected]);
  const on = x => selected.some(y => y.toLowerCase() === x.toLowerCase());
  return `<div class="chips" role="group" aria-label="Instruments">${names.map(x => `<button data-act="inst-toggle" data-scope="${scope}" data-name="${esc(x)}" aria-pressed="${on(x)}">${esc(x)}</button>`).join("")}</div>`;
}
function instAdder(scope) {
  return `<div class="row"><input id="inst-new-${scope}" class="grow" type="text" autocomplete="off" placeholder="Add an instrument, e.g. Clarinet" aria-label="New instrument name"><button class="btn small" data-act="inst-add" data-scope="${scope}">Add</button></div>`;
}
function instOf(piece, node) { return core.effectiveInstruments(piece, node); }
function hiddenCount() {
  if (live()) return sess.hiddenByInstruments(S.session, S.sessionPieces);
  return sess.buildQueue(S.pieces, dayStr()).length - sess.buildQueue(S.pieces, dayStr(), { instruments: pickedNow() }).length;
}
const hiddenNote = n => n > 0 ? `<div class="small muted">${n} more waiting for other instruments.</div>` : "";

function startSession(minutes) {
  if (S.pieces.length === 0) { toast("Add a piece first."); return; }
  S.session = sess.startSession({ now: now(), minutes, studyDay: dayStr(), pieces: S.pieces, softEnd: true, instruments: pickedNow() });
  S.sessionPieces = S.pieces.slice();
  S.endedSession = null; S.skip = new Set(); S.asideLog = []; S.result = null; S.cur = null;
  requestWake();
  pickNext();
}
function queueNow() {
  if (live()) return sess.sessionQueue(S.session, S.sessionPieces, { now: now() });
  return sess.buildQueue(S.pieces, dayStr(), { instruments: pickedNow() });
}
function pickNext() {
  S.result = null;
  if (!active()) { S.cur = null; persist(); render(); return; }
  const q = queueNow().filter(e => !S.skip.has(e.node.id));
  if (q.length === 0) { S.cur = null; persist(); render(); return; }
  pick(q[0].piece, q[0].node);
}
function pick(piece, node) {
  if (S.cur && S.cur.node !== node && S.cur.node.search && S.cur.node.search.trialInProgress) core.pauseSearch(S.cur.node.search);
  const r = sess.startNodeWork(S.session, S.sessionPieces, node, { now: now() });
  reportEvents(r.events);
  if (r.refused) { toast(r.refused); persist(); render(); return; }
  S.cur = { piece, node }; S.result = null; S.view = "practice";
  persist(); render(); window.scrollTo(0, 0);
}
function ensureTrial() {
  if (!S.cur) return;
  const s = S.cur.node.search;
  if (s && !core.isSearchConverged(s) && !s.trialInProgress && active()) core.nextTrial(s);
}
function answer(passed, loc) {
  if (!S.cur) return;
  const { node } = S.cur;
  const r = sess.recordTrial(S.session, S.sessionPieces, node, { now: now(), passed, failureLocation: passed ? null : loc });
  reportEvents(r.events);
  if (r.refused) { toast(r.refused); render(); return; }
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) { /* optional */ } }
  if (r.outcome === "deferred") { S.result = { kind: "saved", node }; S.cur = null; }
  else if (r.outcome === "auto_graded") { S.result = { kind: "autograded", node, piece: pieceOf(node) }; S.cur = null; }
  else ensureTrial();
  afterSessionChange();
}
function grade(g) {
  const { piece, node } = S.cur;
  const hadSplit = node.children.length;
  const note = ($("why") ? $("why").value : "").trim();
  const r = sess.gradeNode(S.session, S.sessionPieces, node, g, { now: now() });
  reportEvents(r.events);
  if (r.refused) { toast(r.refused); render(); return; }
  if (r.decomposedChildren && note) {
    const hs = r.decomposedChildren.find(c => c.kind === "hotspot");
    if (hs) hs.hotspotNote = note;
  }
  S.result = { kind: "graded", grade: g, entry: r.reviewEntry, children: r.decomposedChildren, retryAt: r.retryAt, node, piece, step: node.step, hadSplit };
  S.cur = null;
  afterSessionChange();
}
function setAside(bookmark) {
  const { node } = S.cur;
  if (S.session.phase === "winding_down" && S.session.graceEligibleIds.includes(node.id)) {
    const r = sess.deferNode(S.session, S.sessionPieces, node, { now: now(), bookmark });
    reportEvents(r.events);
    S.result = { kind: "saved", node };
  } else {
    if (node.search && node.search.trialInProgress) core.pauseSearch(node.search);
    core.interruptSession(node, bookmark);
    S.skip.add(node.id);
    S.asideLog.push({ label: node.label, bookmark: bookmark === undefined ? null : bookmark });
    S.result = { kind: "aside", node, bookmark };
  }
  S.cur = null;
  afterSessionChange();
}
function amend(loc) {
  try { core.amendLastFailure(S.cur.node.search, loc); toast(`Last failure moved to m. ${loc}.`); }
  catch (e) { toast(e.message); }
  persist(); render();
}
function extend() {
  const r = sess.extendSession(S.session, S.sessionPieces, { now: now(), minutes: 5 });
  if (r.refused) toast(r.refused); else toast("Five more minutes.");
  persist(); render();
}
function endSession() {
  const events = sess.endSessionNow(S.session, S.sessionPieces, { now: now() });
  reportEvents(events);
  afterSessionChange();
}
function afterSessionChange() {
  if (S.session && S.session.phase === "ended") {
    S.endedSession = { summary: sess.sessionSummary(S.session), minutes: S.session.minutes, aside: S.asideLog.slice() };
    S.session = null; S.sessionPieces = []; S.cur = null; releaseWake();
  }
  persist(); render(); window.scrollTo(0, 0);
}

/* wake lock: keep the tablet awake while practising */
let wake = null;
async function requestWake() { try { if (navigator.wakeLock && live() && document.visibilityState === "visible") wake = await navigator.wakeLock.request("screen"); } catch (e) { /* optional */ } }
function releaseWake() { try { if (wake) wake.release(); } catch (e) { /* optional */ } wake = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { requestWake(); tick(); } });

/* ----------------------------------------------------------------- render */
const ICON = {
  practice: '<svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
  queue: '<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>',
  pieces: '<svg viewBox="0 0 24 24"><path d="M4 4h12l4 4v12H4z"/><path d="M16 4v4h4"/></svg>',
  data: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>'
};
function paintTabs() {
  const items = [["practice", "Practice"], ["queue", "Queue"], ["pieces", "Pieces"], ["data", "Data"]];
  $("tabs").innerHTML = items.map(([k, l]) => `<button data-act="view" data-v="${k}" aria-current="${S.view === k}">${ICON[k]}<span>${l}</span></button>`).join("");
}
function timerChip() {
  if (!S.session) return "";
  const c = sess.sessionClock(S.session, now());
  if (S.session.phase === "winding_down") return `<span class="chip amber" id="clock">Wrapping up</span>`;
  if (c.timeIsUp) return `<span class="chip red" id="clock">+${fmtClock(c.overtimeMs)} over</span>`;
  const amber = c.remainingMs <= 120000;
  return `<span class="chip ${amber ? "amber" : ""}" id="clock">${fmtClock(c.remainingMs)} left</span>`;
}
function paintTop() {
  const sub = live() ? "" : "Systematic Instrumental Practice";
  $("topbar").innerHTML = `<div class="brand"><b>SIP</b><span>${esc(sub)}</span></div><div class="spacer"></div>${S.saveError ? `<span class="chip save-bad" title="${esc(S.saveError)}">Not saved</span>` : ""}${timerChip()}`;
}
function render() {
  if (!S.ready) return;
  paintTabs(); paintTop();
  const v = { practice: viewPractice, queue: viewQueue, pieces: viewPieces, data: viewData }[S.view];
  $("main").innerHTML = v();
  $("overlay").innerHTML = S.sheet ? sheetHtml() : "";
}

/* ---------- practice ---------- */
function viewPractice() {
  if (S.endedSession) return summaryCard();
  if (!S.session) return startCard();
  let h = overtimeBanner();
  if (S.result) return h + resultCard();
  if (!S.cur) return h + idleCard();
  const { piece, node } = S.cur, s = node.search;
  if (!s) return h + idleCard();
  if (core.isSearchConverged(s)) return h + gradeCard();
  return h + workCard();
}
function overtimeBanner() {
  const c = sess.sessionClock(S.session, now());
  if (S.session.phase === "winding_down") return `<div class="banner"><span class="grow">Wrapping up. Finish the attempt in front of you, or set it aside.</span></div>`;
  if (!c.timeIsUp) return "";
  return `<div class="banner red"><span class="grow">Time's up. Keep going?</span><button class="btn small" data-act="extend">Extend 5 min</button><button class="btn small primary" data-act="end">Finish</button></div>`;
}
function startCard() {
  if (S.pieces.length === 0) return `<section class="card"><h1>Welcome</h1><p class="muted" style="margin:0">SIP breaks a piece down to the exact spots that need work, and schedules each one so your short practice sessions go where they matter. Add a piece to begin. Everything stays on this device.</p><button class="btn primary" data-act="view" data-v="pieces">Add a piece</button></section>`;
  const q = queueNow();
  const due = q.filter(e => e.status === "due" || e.status === "retry").length, fresh = q.filter(e => e.status === "new").length, back = q.filter(e => e.status === "interrupted").length;
  return `<section class="card"><div class="eyebrow">Today</div><h1>Ready to practise</h1>
    <div class="row">${back ? `<span class="tag retry">${back} to resume</span>` : ""}<span class="tag due">${due} due</span><span class="tag new">${fresh} new</span></div>
    ${knownInstruments().length ? `<div><div class="eyebrow" style="margin-bottom:8px">Instruments out today</div>${instChips(pickedNow(), "start")}<div class="small muted" style="margin-top:6px">${pickedNow().length ? "Untagged work shows too." : "None chosen, so everything shows."}</div></div>` : ""}
    <div><div class="eyebrow" style="margin-bottom:8px">How long?</div><div class="chips" role="group" aria-label="Session length">${[10, 15, 25, 40].map(m => `<button data-act="mins" data-m="${m}" aria-pressed="${S.minutes === m}">${m}</button>`).join("")}<span class="muted" style="align-self:center">minutes</span></div></div>
    <button class="btn primary" style="min-height:64px;font-size:1.2rem" data-act="start" ${q.length ? "" : "disabled"}>${q.length ? "Start session" : (hiddenCount() > 0 ? "Nothing due for these instruments" : "Nothing due today")}</button>
    ${hiddenNote(hiddenCount())}
    ${q.length ? `<div class="small muted">First up: <b>${esc(q[0].piece.label)}</b>, ${esc(roleOf(q[0].piece, q[0].node))}, ${rng(q[0].node)}</div>` : ""}</section>`;
}
function idleCard() {
  const q = queueNow().filter(e => !S.skip.has(e.node.id));
  if (q.length === 0) return `<section class="card"><h2>Queue is clear</h2><p class="muted" style="margin:0">Nothing else is waiting right now. Finish the session to see what you covered.</p><button class="btn primary" data-act="end">Finish session</button></section>`;
  return `<section class="card"><div class="eyebrow">Next</div><div class="where"><div class="piece">${esc(q[0].piece.label)}</div><div class="node">${esc(roleOf(q[0].piece, q[0].node))}</div><div class="range">${rng(q[0].node)}</div></div><button class="btn primary" style="min-height:64px;font-size:1.2rem" data-act="next">Start</button><button class="btn ghost" data-act="end">Finish session</button></section>`;
}
function workCard() {
  ensureTrial();
  const { piece, node } = S.cur, s = node.search;
  const step = s.currentStep, loc = s.currentStartLocation;
  const t = tempoFor(piece, node, step), t0 = tempoFor(piece, node, 0);
  const note = core.effectiveNote(piece.root, node);
  const grace = S.session.phase === "winding_down";
  const single = node.start === node.end;
  const last = s.history[s.history.length - 1];
  const canAmend = last && last.result === "fail" && !single;
  const chips = s.history.map(h => `<span class="trial-chip ${h.result === "pass" ? "p" : "f"}">${fmtPct(h.step)} ${h.result === "pass" ? "✓" : "✗ m." + h.failureLocation}</span>`).join("");
  return `<section class="card tight">
    <div class="head"><div class="ptitle">${esc(piece.label)}</div><div class="seg">${esc(roleOf(piece, node))} · <span class="num">${rng(node)}</span>${knownInstruments().length > 1 && instOf(piece, node).length ? " · " + esc(instOf(piece, node).join(" + ")) : ""}</div></div>
    ${grace ? `<div class="banner"><span class="grow">Last attempt, then it's saved for next time.</span></div>` : ""}
    <div class="readout">
      ${t0 ? `<div class="mk">Metronome <b>♩ ${Math.round(t0.first)}</b> as marked${t0.varies ? " at the start" : ""}, then</div>` : `<div class="mk">Tempo adjustment</div>`}
      <div class="pct ${step >= 0 ? "pos" : ""}">${fmtPct(step)}</div>
      ${t ? `<div class="calc"><small>plays at</small>♩ ${Math.round(t.first)}</div>` : ""}
    </div>
    <div class="startat tight"><span class="muted">Start at</span><b>m. ${loc}</b></div>
    ${note ? `<div class="note tight"><b>Watch for:</b> ${esc(note)}</div>` : ""}
    <div class="answers tight">
      <button class="pass" data-act="pass">Pass<small>played clean</small></button>
      <button class="fail" data-act="fail">Fail<small>${single ? "it broke" : "it broke somewhere"}</small></button>
    </div>
    <div class="footrow">
      ${chips ? `<div class="ladder" aria-label="Trials so far">${chips}</div>` : '<span class="grow" style="flex:1"></span>'}
      ${canAmend ? `<button class="btn small ghost" data-act="amend">Fix last failure</button>` : ""}
      <button class="btn small ghost" data-act="aside">${grace ? "Save for next time" : "Set aside"}</button>
    </div>
  </section><p class="small muted kbdhint" style="margin:0;text-align:center"><span class="kbd">P</span> pass &nbsp; <span class="kbd">F</span> fail</p>`;
}
function gradeCard() {
  const { piece, node } = S.cur, s = node.search;
  const found = s.history.some(h => h.result === "fail");
  const willSplit = found && node.children.length === 0 && node.kind !== "hotspot";
  const sug = core.suggestGrade(node);
  const t = tempoFor(piece, node, s.passStep);
  const first = node.fsrs === null;
  const delta = s.passStep - node.step;
  const cmp = first ? "" : `Last time ${fmtStep(node.step)}, now ${fmtStep(s.passStep)} (${delta === 0 ? "no change" : fmtStep(delta) + " steps"}).`;
  const hs = s.hotspotCandidate;
  return `<section class="card">
    <div class="where"><div class="piece">${esc(piece.label)}</div><div class="node">${esc(roleOf(piece, node))}</div><div class="range">${rng(node)}</div></div>
    <div class="tempo"><div class="label">${found ? "It holds up to" : "Clean at the top of the range"}</div><div class="adjust ${s.passStep < 0 ? "neg" : ""}">${fmtPct(s.passStep)}</div>${t ? `<div class="result">♩ ${Math.round(t.first)}</div>` : ""}</div>
    ${found && !single(node) ? `<div class="startat"><span class="muted">Trouble spot</span><b>m. ${hs}</b></div>` : ""}
    ${cmp ? `<div class="small muted" style="text-align:center">${cmp}</div>` : ""}
    ${willSplit ? `<label class="field" for="why">Why does it break there?<small>Optional. It stays with the hotspot as a reminder.</small><input type="text" id="why" maxlength="100" placeholder="e.g. ring finger not covering the tone hole" autocomplete="off"></label>` : ""}
    <div class="eyebrow">How did it go?</div>
    <div class="grades">${[1, 2, 3, 4].map(g => `<button data-act="grade" data-g="${g}" class="${g === sug ? "suggested" : ""}">${g === sug ? '<span class="sug">Suggested</span>' : ""}${GRADE_NAME[g]}<small>${GRADE_HINT[g]}</small></button>`).join("")}</div>
    <div class="row"><button class="btn small ghost" data-act="amend">Fix last failure</button></div>
  </section>`;
}
const single = n => n.start === n.end;
function resultCard() {
  const r = S.result;
  const next = `<div class="row"><button class="btn primary grow" style="min-height:60px" data-act="next">Next</button><button class="btn ghost" data-act="end">Finish</button></div>`;
  if (r.kind === "graded") {
    const days = r.entry.interval;
    const parts = r.children ? `<div class="small muted">Now split into ${r.children.length} parts that come up on their own:</div><div class="row">${r.children.map(c => `<span class="tag ${c.kind === "hotspot" ? "due" : "new"}">${esc(roleOf(r.piece, c))} · ${rng(c)}</span>`).join("")}</div>` : "";
    const hs = r.children && r.children.find(c => c.kind === "hotspot");
    const retry = r.retryAt ? `<div class="banner"><span class="grow">Set aside. It comes back in about ${sess.RETRY_MINUTES} minutes, measured against ${fmtPct(r.step)}.</span></div>` : "";
    return `<section class="card"><div class="eyebrow">Graded ${GRADE_NAME[r.grade]}</div><h2>${esc(r.piece.label)} · ${esc(roleOf(r.piece, r.node))}</h2>
      <div>Comes back in <b>${days} day${days === 1 ? "" : "s"}</b> (${fmtDate(r.entry.due)}).</div>${retry}${parts}
      ${hs && hs.hotspotNote ? `<div class="note">${esc(hs.hotspotNote)}</div>` : ""}${next}</section>`;
  }
  if (r.kind === "autograded") return `<section class="card"><h2>Graded automatically</h2><p class="muted" style="margin:0">That last attempt finished the search, so it was graded for you.</p><button class="btn primary" data-act="end">See summary</button></section>`;
  if (r.kind === "saved") return `<section class="card"><h2>Saved for next time</h2><p class="muted" style="margin:0">It will be first in line next session.</p>${S.session && S.session.phase === "active" ? next : ""}</section>`;
  return `<section class="card"><h2>Set aside</h2><p class="muted" style="margin:0">${r.bookmark ? `It's bookmarked at m. ${r.bookmark} and will be first in line next session.` : "It will be first in line next session."}</p>${next}</section>`;
}
function summaryCard() {
  const { summary, aside = [] } = S.endedSession;
  const g = summary.graded, d = summary.deferred.concat(aside.map(a => ({ label: a.label, bookmark: a.bookmark })));
  const total = g.length + d.length;
  return `<section class="card"><div class="eyebrow">Session finished</div><h1>${total === 0 ? "Nothing worked on" : `${total} section${total === 1 ? "" : "s"} worked`}</h1>
    ${g.length ? `<div class="list">${g.map(x => `<div class="item"><div class="body"><div class="t">${esc(x.label)}</div></div><span class="tag ${x.grade >= 3 ? "ok" : "due"}">${GRADE_NAME[x.grade]}${x.auto ? " (auto)" : ""}</span></div>`).join("")}</div>` : ""}
    ${d.length ? `<div class="small muted">Saved for next time</div><div class="list">${d.map(x => `<div class="item"><div class="body"><div class="t">${esc(x.label)}</div><div class="s">${x.bookmark !== null && x.bookmark !== undefined ? "bookmarked at m. " + x.bookmark : "resumes from its hotspot candidate"}</div></div></div>`).join("")}</div>` : ""}
    <button class="btn primary" data-act="dismiss">Done</button></section>`;
}

/* ---------- queue ---------- */
function viewQueue() {
  const q = queueNow();
  if (S.pieces.length === 0) return `<section class="card"><h2>Queue</h2><div class="empty">Add a piece and its sections will line up here.</div></section>`;
  if (q.length === 0) return `<section class="card"><h2>Queue</h2><div class="empty">Nothing is due ${hiddenCount() > 0 ? "for these instruments" : "today"}.</div>${hiddenNote(hiddenCount())}</section>`;
  const canPick = active();
  return `<section class="card"><div class="row"><h2 class="grow">Queue</h2><span class="muted small">${q.length} waiting</span></div>${hiddenNote(hiddenCount())}
    <div class="list">${q.map((e, i) => {
      const tag = e.status === "interrupted" ? `<span class="tag retry">resume${e.bookmark !== null ? " @ m. " + e.bookmark : ""}</span>`
        : e.status === "retry" ? `<span class="tag retry">${e.waitMs > 0 ? "retry in " + Math.ceil(e.waitMs / 60000) + " min" : "retry now"}</span>`
        : e.status === "new" ? `<span class="tag new">new</span>`
        : `<span class="tag due">${e.daysOverdue === 0 ? "due today" : e.daysOverdue + " d overdue"}</span>`;
      const cur = S.cur && S.cur.node === e.node;
      return `<div class="item"><div class="body"><div class="t">${esc(e.piece.label)} · ${esc(roleOf(e.piece, e.node))}</div><div class="s"><span class="num">${rng(e.node)}</span>${tag}${e.hasChildren ? '<span class="tag">whole review</span>' : ""}</div>${e.note ? `<div class="s">why: ${esc(e.note)}</div>` : ""}</div>${canPick ? `<button class="btn small ${cur ? "ghost" : ""}" data-act="pick" data-id="${e.node.id}">${cur ? "Current" : "Practise"}</button>` : ""}</div>`;
    }).join("")}</div>
    ${live() ? "" : `<button class="btn primary" data-act="view" data-v="practice">Go to Practice to start</button>`}</section>`;
}

/* ---------- pieces ---------- */
function viewPieces() {
  const f = S.form;
  let h = `<section class="card"><h2>Add a piece</h2>
    <label class="field" for="f-label">Title<input id="f-label" type="text" value="${esc(f.label)}" autocomplete="off" placeholder="e.g. Gaston"></label>
    <div class="row"><label class="field grow" for="f-start">First measure<input id="f-start" type="number" inputmode="numeric" min="1" value="${esc(f.start)}"></label>
    <label class="field grow" for="f-end">Last measure<input id="f-end" type="number" inputmode="numeric" min="1" value="${esc(f.end)}"></label>
    <label class="field grow" for="f-tempo">Marked tempo<small>♩ per minute, optional</small><input id="f-tempo" type="number" inputmode="numeric" min="1" value="${esc(f.tempo)}"></label></div>
    <div><div class="eyebrow" style="margin-bottom:8px">Instruments <span class="muted" style="text-transform:none;letter-spacing:0">(optional)</span></div>${instChips(S.form.inst, "form")}${instAdder("form")}</div>
    ${S.formError ? `<div class="banner red"><span class="grow">${esc(S.formError)}</span></div>` : ""}
    <div class="row"><button class="btn primary grow" data-act="addpiece">Add piece</button>${S.pieces.length === 0 ? `<button class="btn ghost" data-act="example">Try an example</button>` : ""}</div></section>`;
  S.pieces.forEach((p, pi) => {
    const nodes = []; const walk = (n, d) => { nodes.push([n, d]); n.children.forEach(c => walk(c, d + 1)); }; walk(p.root, 0);
    h += `<section class="card"><div class="row"><div class="grow"><h2>${esc(p.label)}</h2><div class="small muted num">${rng(p.root)}${p.goalTempo ? " · ♩ " + p.goalTempo : ""}</div><div class="small" style="margin-top:4px">${p.instruments.length ? p.instruments.map(x => `<span class="tag new">${esc(x)}</span>`).join(" ") : `<span class="muted">No instrument set</span>`}</div></div><button class="btn small ghost" data-act="inst-edit" data-pi="${pi}" data-id="${p.root.id}">Instruments</button><button class="btn small danger" data-act="removepiece" data-i="${pi}">Remove</button></div>
      <div class="list tree">${nodes.map(([n, d]) => {
        const t = tempoFor(p, n, n.step);
        const st = n.fsrs ? (core.dateOnly(n.fsrs.due) <= dayDate() ? `<span class="tag due">due</span>` : `<span class="tag ok">${fmtDate(core.dateOnly(n.fsrs.due))}</span>`) : `<span class="tag new">new</span>`;
        return `<div class="item" style="--depth:${d}"><div class="body"><div class="t">${esc(roleOf(p, n))}</div><div class="s"><span class="num">${rng(n)}</span>${st}${n.instruments ? n.instruments.map(x => `<span class="tag new">${esc(x)}</span>`).join("") : ""}${n.fsrs ? `<span class="num">${fmtPct(n.step)}${t ? " · ♩ " + Math.round(t.first) : ""}</span>` : ""}</div></div>${d > 0 ? `<button class="btn small ghost" data-act="inst-edit" data-pi="${pi}" data-id="${n.id}">Tag</button>` : ""}${active() ? `<button class="btn small ghost" data-act="pick" data-id="${n.id}">Practise</button>` : ""}</div>`;
      }).join("")}</div></section>`;
  });
  return h;
}
function addPiece(label, start, end, tempo, inst) {
  const L = label.trim();
  if (!L) throw new Error("Give the piece a title.");
  if (S.pieces.some(p => p.label === L)) throw new Error(`There is already a piece called "${L}".`);
  const a = Number(start), b = Number(end);
  if (!Number.isInteger(a) || !Number.isInteger(b) || a < 1 || b < a) throw new Error("Measures must be whole numbers, with the last measure at or after the first.");
  let goal = null;
  if (String(tempo).trim() !== "") { goal = Number(tempo); if (!Number.isFinite(goal) || goal <= 0) throw new Error("Tempo must be a positive number, or left empty."); }
  const root = core.makeNode({ label: L, start: a, end: b, parentId: null });
  const piece = pc.makePiece({ label: L, root, goalTempo: goal, instruments: inst });
  S.pieces.push(piece);
  return piece;
}

/* ---------- data ---------- */
function viewData() {
  return `<section class="card"><h2>Saved on this device</h2>
    <p class="muted" style="margin:0">${S.durable ? "Your pieces, history and any running session are stored in this browser, on this device only. Other devices do not see them." : "This browser would not allow saving, so nothing here will be kept. Open the app in a normal window, or use a backup file."}</p>
    ${S.saveError ? `<div class="banner red"><span class="grow">Last save failed: ${esc(S.saveError)}</span></div>` : ""}
    <div class="row"><button class="btn small" data-act="persistent">Ask the browser to keep it</button><span class="small muted" id="persistmsg"></span></div></section>
  <section class="card"><h2>Back up or move</h2>
    <p class="muted" style="margin:0">Make a backup before changing devices or clearing browser data. Import replaces what is here; the old pieces are kept in a removed folder inside the app.</p>
    <div class="row"><button class="btn" data-act="export">Make backup</button></div>
    ${S.exportText ? `<pre class="out" id="exportout">${esc(S.exportText.slice(0, 600))}${S.exportText.length > 600 ? "\n…" : ""}</pre><div class="row"><button class="btn small" data-act="download">Save as file</button><button class="btn small" data-act="copy">Copy</button><span class="small muted">${Math.round(S.exportText.length / 1024)} KB</span></div>` : ""}
    <label class="field" for="importbox">Restore<small>Choose a backup file, or paste its text here.</small><input id="importfile" type="file" accept=".json,application/json,.txt"><textarea id="importbox" rows="3" placeholder="Paste backup text">${esc(S.importText)}</textarea></label>
    <div class="row"><button class="btn" data-act="import">Restore from backup</button></div>
    ${S.importMsg ? `<div class="small">${esc(S.importMsg)}</div>` : ""}</section>
  <section class="card"><h2>Look</h2><div class="chips" role="group" aria-label="Theme">${["system", "light", "dark"].map(t => `<button data-act="theme" data-t="${t}" aria-pressed="${themePref() === t}">${t}</button>`).join("")}</div>
    <div class="small muted">Keyboard: <span class="kbd">P</span> pass, <span class="kbd">F</span> fail, <span class="kbd">N</span> next.</div></section>
  <section class="card flat"><h3>Tip for the music stand</h3><p class="muted small" style="margin:0">Put SIP in split screen next to your score and metronome. The practice screen is one column, so a narrow panel works. Add it to the home screen to open it full screen, and it keeps working offline.</p></section>`;
}
function themePref() { try { return localStorage.getItem("sip-theme") || "system"; } catch (e) { return "system"; } }
function applyTheme() {
  const t = themePref(), r = document.documentElement;
  if (t === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", t);
}
async function buildBackup() {
  const files = {};
  const ad = S.adapter;
  for (const k of await ad.list("pieces/")) files[k] = await ad.get(k);
  const ws = await ad.get(sto.WORKSPACE_KEY); if (ws !== null) files[sto.WORKSPACE_KEY] = ws;
  return JSON.stringify({ format: "sip-backup", version: 1, savedAt: new Date().toISOString(), files }, null, 1);
}
async function restoreBackup(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { throw new Error("That is not a backup file (it could not be read)."); }
  if (!data || data.format !== "sip-backup" || typeof data.files !== "object" || data.files === null) throw new Error("That is not a SIP backup file.");
  const keys = Object.keys(data.files);
  keys.forEach(k => { sto.assertValidKey(k); if (!(k === sto.WORKSPACE_KEY || /^pieces\/[A-Za-z0-9._-]+\.json$/.test(k)) || typeof data.files[k] !== "string") throw new Error(`Unexpected entry in the backup: ${k}`); });
  if (!keys.includes(sto.WORKSPACE_KEY)) throw new Error("The backup has no workspace.json.");
  const ad = S.adapter, stamp = new Date().toISOString().replace(/[^0-9]/g, "").slice(0, 14);
  for (const k of await ad.list("pieces/")) { const old = await ad.get(k); if (old !== null) await ad.put(`removed/${dayStr()}/${stamp}-${k.slice(7)}`, old); await ad.delete(k); }
  for (const k of keys) await ad.put(k, data.files[k]);
  await loadAll();
}

/* ------------------------------------------------------------------ sheet */
function sheetHtml() {
  const sh = S.sheet;
  if (sh.kind === "inst") return `<div class="scrim" data-act="sheet-cancel"><div class="sheet" role="dialog" aria-label="${esc(sh.title)}" data-stop="1"><h2>${esc(sh.title)}</h2><p class="muted small" style="margin:-8px 0 0">${esc(sh.sub)}</p>${instChips(sh.value, "sheet")}${instAdder("sheet")}<div class="row"><button class="btn grow" data-act="sheet-cancel">Cancel</button><button class="btn primary grow" data-act="sheet-ok" id="sheetok">Save</button></div></div></div>`;
  if (sh.kind === "confirm") return `<div class="scrim" data-act="sheet-cancel"><div class="sheet" role="dialog" aria-label="${esc(sh.title)}" data-stop="1"><h2>${esc(sh.title)}</h2><p class="muted" style="margin:0">${esc(sh.body)}</p><div class="row"><button class="btn grow" data-act="sheet-cancel">Cancel</button><button class="btn danger grow" data-act="sheet-ok">${esc(sh.cta)}</button></div></div></div>`;
  return `<div class="scrim" data-act="sheet-cancel"><div class="sheet" role="dialog" aria-label="${esc(sh.title)}" data-stop="1">
    <h2>${esc(sh.title)}</h2>${sh.sub ? `<div class="muted small" style="margin-top:-8px">${esc(sh.sub)}</div>` : ""}
    <div class="bigval" id="bigval">m. ${sh.value}</div>
    <div class="stepper">${[-5, -1, 1, 5].map(d => `<button data-act="sheet-adj" data-d="${d}">${d > 0 ? "+" : "−"}${Math.abs(d)}</button>`).join("")}</div>
    <input type="range" id="sheetrange" min="${sh.lo}" max="${sh.hi}" value="${sh.value}" aria-label="Measure">
    <div class="row"><button class="btn grow" data-act="sheet-cancel">Cancel</button>${sh.skip ? `<button class="btn grow" data-act="sheet-skip">${esc(sh.skip)}</button>` : ""}<button class="btn primary grow" data-act="sheet-ok" id="sheetok">${esc(sh.cta)}</button></div></div></div>`;
}
function setSheetValue(v) {
  const sh = S.sheet; if (!sh || sh.kind === "confirm" || sh.kind === "inst") return;
  sh.value = Math.min(sh.hi, Math.max(sh.lo, Math.round(v)));
  const bv = $("bigval"), rg = $("sheetrange"); if (bv) bv.textContent = `m. ${sh.value}`; if (rg) rg.value = sh.value;
}
function openFail() {
  const { node } = S.cur, s = node.search;
  const lo = Math.max(node.start, s.currentStartLocation), hi = node.end;
  if (node.start === node.end) { answer(false, node.start); return; }
  S.sheet = { kind: "fail", title: "Where did it break?", sub: `Measures ${lo}–${hi}`, lo, hi, value: Math.round((lo + hi) / 2), cta: "Broke here" };
  render();
}

/* ---------------------------------------------------------------- actions */
function onAct(act, el) {
  switch (act) {
    case "view": S.view = el.dataset.v; S.sheet = null; render(); window.scrollTo(0, 0); break;
    case "mins": S.minutes = Number(el.dataset.m); render(); break;
    case "start": startSession(S.minutes); break;
    case "next": pickNext(); break;
    case "pick": {
      const id = Number(el.dataset.id);
      for (const p of S.pieces) { const n = core.flattenTree(p.root).find(x => x.id === id); if (n) { pick(p, n); break; } }
      break;
    }
    case "pass": answer(true); break;
    case "fail": openFail(); break;
    case "grade": grade(Number(el.dataset.g)); break;
    case "amend": {
      const { node } = S.cur, last = node.search.history[node.search.history.length - 1];
      if (!last || last.result !== "fail") { toast("There is no failure to fix."); break; }
      S.sheet = { kind: "amend", title: "Where did it really break?", sub: `Was m. ${last.failureLocation}`, lo: node.start, hi: node.end, value: last.failureLocation, cta: "Move it here" };
      render(); break;
    }
    case "aside": {
      const { node } = S.cur;
      if (node.start === node.end) { setAside(); break; }
      S.sheet = { kind: "aside", title: "Where did you stop?", sub: "Next time you can pick up from here.", lo: node.start, hi: node.end, value: Math.max(node.start, node.search ? node.search.currentStartLocation : node.start), cta: "Bookmark here", skip: "No bookmark" };
      render(); break;
    }
    case "extend": extend(); break;
    case "end": endSession(); break;
    case "dismiss": S.endedSession = null; render(); break;
    case "sheet-adj": setSheetValue(S.sheet.value + Number(el.dataset.d)); break;
    case "sheet-cancel": S.sheet = null; render(); break;
    case "sheet-skip": { const k = S.sheet.kind; S.sheet = null; if (k === "aside") setAside(undefined); break; }
    case "sheet-ok": {
      const sh = S.sheet; S.sheet = null;
      if (sh.kind === "fail") answer(false, sh.value);
      else if (sh.kind === "amend") amend(sh.value);
      else if (sh.kind === "aside") setAside(sh.value);
      else if (sh.kind === "confirm") sh.run();
      else if (sh.kind === "inst") {
        const piece = S.pieces[sh.pi];
        if (sh.isPiece) pc.setPieceInstruments(piece, sh.value);
        else { const n = core.flattenTree(piece.root).find(x => x.id === sh.nodeId); if (n) pc.setNodeInstruments(n, sh.value); }
        persist(); render(); toast("Saved.");
      }
      break;
    }
    case "inst-toggle": {
      const sc = el.dataset.scope, name = el.dataset.name;
      if (sc === "start") { S.picked = toggleName(pickedNow(), name); savePicked(); }
      else if (sc === "form") S.form.inst = toggleName(S.form.inst, name);
      else if (S.sheet && S.sheet.kind === "inst") S.sheet.value = toggleName(S.sheet.value, name);
      render(); break;
    }
    case "inst-add": {
      const sc = el.dataset.scope, box = $("inst-new-" + sc), add = core.normalizeInstruments(box ? box.value : "");
      if (!add.length) { if (box) box.focus(); break; }
      if (sc === "form") S.form.inst = core.normalizeInstruments([...S.form.inst, ...add]);
      else if (S.sheet && S.sheet.kind === "inst") S.sheet.value = core.normalizeInstruments([...S.sheet.value, ...add]);
      render(); break;
    }
    case "inst-edit": {
      const pi = Number(el.dataset.pi), piece = S.pieces[pi], id = Number(el.dataset.id);
      const node = core.flattenTree(piece.root).find(x => x.id === id), isPiece = node === piece.root;
      S.sheet = isPiece
        ? { kind: "inst", title: `Instruments for ${piece.label}`, sub: "What this piece is played on. Sections inherit this unless you tag them separately.", value: piece.instruments.slice(), pi, isPiece: true }
        : { kind: "inst", title: `Instruments for ${roleOf(piece, node)}`, sub: piece.instruments.length || (node.instruments || []).length ? "Leave all off to use the instruments of the section above (" + (instOf(piece, node).join(", ") || "none") + ")." : "Leave all off to use the instruments of the section above.", value: (node.instruments || []).slice(), pi, nodeId: id, isPiece: false };
      render(); break;
    }
    case "addpiece":
      try { const p = addPiece(S.form.label, S.form.start, S.form.end, S.form.tempo, S.form.inst); S.form = { label: "", start: "1", end: "", tempo: "", inst: S.form.inst }; S.formError = ""; toast(`Added ${p.label}.`); persist(); }
      catch (e) { S.formError = e.message; }
      render(); break;
    case "example": {
      try { addPiece("Example Etude", 1, 48, 96); S.formError = ""; persist(); toast("Added an example piece."); } catch (e) { S.formError = e.message; }
      render(); break;
    }
    case "removepiece": {
      const p = S.pieces[Number(el.dataset.i)];
      if (live()) { toast("Finish the session before removing a piece."); break; }
      S.sheet = { kind: "confirm", title: `Remove ${p.label}?`, body: "Its history moves to the removed folder inside the app, so it can be recovered from a backup.", cta: "Remove", run: () => { S.pieces.splice(S.pieces.indexOf(p), 1); S.cur = null; persist(); render(); toast("Removed."); } };
      render(); break;
    }
    case "export": buildBackup().then(t => { S.exportText = t; render(); }).catch(e => toast(e.message)); break;
    case "download": downloadText(S.exportText); break;
    case "copy": copyText(S.exportText); break;
    case "import": {
      const text = $("importbox").value; S.importText = text;
      if (!text.trim()) { S.importMsg = "Choose a file or paste the backup text first."; render(); break; }
      S.sheet = { kind: "confirm", title: "Replace everything here?", body: "This swaps the pieces and history on this device for the ones in the backup.", cta: "Restore", run: () => restoreBackup(text).then(() => { S.importMsg = "Restored."; S.importText = ""; render(); }).catch(e => { S.importMsg = e.message; render(); }) };
      render(); break;
    }
    case "theme": try { localStorage.setItem("sip-theme", el.dataset.t); } catch (e) { /* optional */ } applyTheme(); render(); break;
    case "persistent":
      (navigator.storage && navigator.storage.persist ? navigator.storage.persist() : Promise.resolve(false)).then(ok => { const m = $("persistmsg"); if (m) m.textContent = ok ? "Done. The browser will keep it." : "The browser did not agree. Back up now and then."; });
      break;
  }
}
function downloadText(text) {
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    a.download = `sip-backup-${dayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { toast("Saving a file is not possible here. Use Copy instead."); }
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast("Copied."), () => toast("Could not copy. Select the text and copy it."));
  else toast("Could not copy. Select the text and copy it.");
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  if (el.classList.contains("scrim") && ev.target !== el) return; // clicks inside the sheet don't dismiss it
  onAct(el.dataset.act, el);
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "sheetrange") setSheetValue(Number(t.value));
  else if (t.id === "f-label") S.form.label = t.value;
  else if (t.id === "f-start") S.form.start = t.value;
  else if (t.id === "f-end") S.form.end = t.value;
  else if (t.id === "f-tempo") S.form.tempo = t.value;
  else if (t.id === "importbox") S.importText = t.value;
});
document.addEventListener("change", ev => {
  if (ev.target.id === "importfile" && ev.target.files && ev.target.files[0]) {
    const rd = new FileReader();
    rd.onload = () => { S.importText = String(rd.result); render(); };
    rd.readAsText(ev.target.files[0]);
  }
});
document.addEventListener("keydown", ev => {
  if (ev.target.closest && ev.target.closest("input, textarea")) return;
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if (S.sheet) { if (k === "enter") onAct("sheet-ok"); else if (k === "escape") onAct("sheet-cancel"); else if (k === "arrowleft" || k === "arrowdown") setSheetValue(S.sheet.value - 1); else if (k === "arrowright" || k === "arrowup") setSheetValue(S.sheet.value + 1); return; }
  if (S.view !== "practice" || !S.cur || !S.session) return;
  const s = S.cur.node.search;
  if (s && !S.result && !core.isSearchConverged(s)) { if (k === "p") onAct("pass"); else if (k === "f") onAct("fail"); }
  if (S.result && k === "n") onAct("next");
});

/* ------------------------------------------------------------------ clock */
function tick() {
  if (!S.ready || !S.session) return;
  const events = sess.tickSession(S.session, S.sessionPieces, { now: now() });
  if (events.length) { reportEvents(events); persist(); render(); return; }
  const chip = $("clock");
  if (chip) { const fresh = document.createElement("div"); fresh.innerHTML = timerChip(); if (fresh.firstElementChild) { chip.className = fresh.firstElementChild.className; chip.textContent = fresh.firstElementChild.textContent; } }
}
setInterval(tick, 1000);

/* ------------------------------------------------------------------- boot */
async function loadAll() {
  const loaded = await S.store.load({ now: new Date() });
  S.pieces = loaded.pieces; S.settings = loaded.settings; S.wishlist = loaded.wishlist;
  core.resetIdCounter(loaded.nextFreeId);
  S.session = null; S.sessionPieces = []; S.cur = null; S.result = null;
  if (loaded.session) { S.session = loaded.session.session; S.sessionPieces = loaded.session.pieces; }
  if (S.session) {
    const events = sess.settleSession(S.session, S.sessionPieces, { now: now() });
    reportEvents(events);
    if (S.session.phase === "ended") { S.endedSession = { summary: sess.sessionSummary(S.session), minutes: S.session.minutes }; S.session = null; S.sessionPieces = []; }
    else if (loaded.current && loaded.current.node.search !== null) S.cur = { piece: loaded.current.piece, node: loaded.current.node };
    if (S.session) requestWake();
  }
  loaded.warnings.forEach(w => toast(w));
  S.ready = true;
  render();
  if (S.cur) { ensureTrial(); render(); }
  persist();
}
(async function boot() {
  applyTheme();
  const { adapter, durable } = await makeAdapter();
  S.adapter = adapter; S.durable = durable; S.store = sto.createStore(adapter);
  try { await loadAll(); } catch (e) { S.ready = true; $("main").innerHTML = `<section class="card"><h2>Could not open your data</h2><p class="muted" style="margin:0">${esc(e.message)}</p></section>`; }
  try { if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) { /* optional */ }
  window.__sip = { S, core, sess, pc, sto }; // for tests
})();
</script>

</html>
