  --line: #d4dad5;
  --accent: #0d6a62;    /* the one brand colour: deep teal */
  --accent-fg: #ffffff;
  --accent-soft: #d8ece8;
  --pass: #1b7a45;
  --pass-soft: #d9efe1;
  --fail: #b5301c;
  --fail-soft: #f6dcd6;
  --warn: #9a5b00;
  --warn-soft: #f6e6c6;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(20,30,25,.08), 0 6px 18px rgba(20,30,25,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --surface: #182120; --surface-2: #212c29; --fg: #e8eeea; --muted: #97a59e; --line: #2b3834;
    --accent: #52c2b3; --accent-fg: #06201c; --accent-soft: #17332f;
    --pass: #5fd08a; --pass-soft: #163423; --fail: #ff8a74; --fail-soft: #3b1d17; --warn: #f0b04a; --warn-soft: #36290f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --surface: #182120; --surface-2: #212c29; --fg: #e8eeea; --muted: #97a59e; --line: #2b3834;
  --accent: #52c2b3; --accent-fg: #06201c; --accent-soft: #17332f;
  --pass: #5fd08a; --pass-soft: #163423; --fail: #ff8a74; --fail-soft: #3b1d17; --warn: #f0b04a; --warn-soft: #36290f;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }

#shell { min-height: 100%; display: flex; flex-direction: column; }
.wrap { width: 100%; max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { font-weight: 700; letter-spacing: .02em; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand b { font-size: 1.15rem; }
.brand span { color: var(--muted); font-size: .8rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface-2); font-family: var(--font-num); font-size: .95rem; font-weight: 500; white-space: nowrap; }
.chip.amber { background: var(--warn-soft); color: var(--warn); }
.chip.red { background: var(--fail-soft); color: var(--fail); }
.chip.save-bad { background: var(--fail-soft); color: var(--fail); font-family: var(--font-ui); }
main { flex: 1; padding-block: 12px calc(84px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding-block: 6px; }

nav.tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="true"] { color: var(--accent); background: var(--accent-soft); }
nav.tabs .badge { position: absolute; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }

h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 18px; border-radius: 12px; background: var(--surface-2); font-weight: 600; text-align: center; }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.danger { background: var(--fail-soft); color: var(--fail); }
.btn.small { min-height: 40px; padding: 8px 14px; font-size: .92rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }

/* practice */
.where { display: flex; flex-direction: column; gap: 4px; }
.where .piece { font-size: .85rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
.where .node { font-size: 1.55rem; font-weight: 700; line-height: 1.1; }
.where .range { font-family: var(--font-num); color: var(--muted); font-size: 1rem; }
.tempo { display: grid; grid-template-columns: 1fr; gap: 6px; text-align: center; padding-block: 6px; }
.tempo .label { font-size: .8rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.tempo .marked { font-family: var(--font-num); font-size: 1.35rem; font-weight: 500; }
.tempo .adjust { font-family: var(--font-num); font-size: clamp(3.6rem, 17vw, 6.4rem); font-weight: 600; line-height: 1; letter-spacing: -.02em; color: var(--accent); }
.tempo .adjust.neg { color: var(--fg); }
.tempo .result { font-family: var(--font-num); font-size: 1.15rem; color: var(--muted); }
.startat { display: flex; align-items: baseline; justify-content: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--surface-2); }
.startat b { font-family: var(--font-num); font-size: 1.6rem; }
.note { padding: 10px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--fg); border-left: 4px solid var(--warn); }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.answers button { min-height: 108px; border-radius: 18px; font-size: 1.8rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.answers button small { font-size: .8rem; font-weight: 500; opacity: .8; }
.answers .pass { background: var(--pass); color: #fff; }
.answers .fail { background: var(--fail); color: #fff; }
:root[data-theme="dark"] .answers .pass, :root[data-theme="dark"] .answers .fail { color: #0b0f0d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .answers .pass, :root:not([data-theme="light"]) .answers .fail { color: #0b0f0d; } }
.ladder { display: flex; flex-wrap: wrap; gap: 6px; }
.trial-chip { font-family: var(--font-num); font-size: .82rem; padding: 4px 9px; border-radius: 8px; background: var(--surface-2); }
.trial-chip.p { background: var(--pass-soft); color: var(--pass); }
.trial-chip.f { background: var(--fail-soft); color: var(--fail); }
.banner { padding: 12px 14px; border-radius: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: var(--warn-soft); color: var(--fg); }
.banner.red { background: var(--fail-soft); }
.banner .grow { flex: 1; min-width: 180px; font-weight: 600; }
.grades { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grades button { min-height: 84px; border-radius: 14px; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700; font-size: 1.15rem; border: 2px solid transparent; }

label.field small { font-weight: 400; color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips button { min-height: 48px; min-width: 64px; padding: 8px 16px; border-radius: 999px; background: var(--surface-2); font-family: var(--font-num); font-weight: 600; }

/* lists */
.list { display: flex; flex-direction: column; }
.item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .body { flex: 1; min-width: 0; }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .s { font-size: .86rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tag { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tag.new { background: var(--accent-soft); color: var(--accent); }
.tag.due { background: var(--warn-soft); color: var(--warn); }
.tag.retry { background: var(--fail-soft); color: var(--fail); }
.tag.ok { background: var(--pass-soft); color: var(--pass); }
.tree .item { padding-left: calc(var(--depth, 0) * 18px); }

.bigval { font-family: var(--font-num); font-size: 4rem; font-weight: 600; text-align: center; line-height: 1; }
.stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

.empty { text-align: center; padding: 24px 8px; color: var(--muted); }
.kbd { font-family: var(--font-num); font-size: .8rem; padding: 1px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }

.card.tight { gap: 8px; padding: 14px; }
.head { display: flex; flex-direction: column; gap: 2px; }
.ptitle { font-size: clamp(1.55rem, 7vw, 2.1rem); font-weight: 700; line-height: 1.08; overflow-wrap: anywhere; text-wrap: balance; }
.seg { font-size: .82rem; color: var(--muted); }

.readout .mk { font-size: .88rem; color: var(--muted); }
.readout .mk b { font-family: var(--font-num); color: var(--fg); font-weight: 600; }
.readout .pct { font-family: var(--font-num); font-size: clamp(2.7rem, 12.5vw, 4.2rem); font-weight: 600; line-height: 1.02; letter-spacing: -.02em; color: var(--muted); }
.readout .pct.pos { color: var(--accent); }
.readout .calc { font-family: var(--font-num); font-size: clamp(2.1rem, 10vw, 3.1rem); font-weight: 600; line-height: 1.05; color: var(--fg); }

.startat.tight b { font-size: 1.35rem; }
.answers.tight button { min-height: 84px; font-size: 1.6rem; border-radius: 16px; }
.answers.tight button small { font-size: .74rem; }
.note.tight { padding: 7px 12px; font-size: .92rem; }
.footrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.footrow .ladder { flex: 1; min-width: 0; }
@media (pointer: coarse) { .kbdhint { display: none; } }
@media (min-width: 900px) { body { font-size: 18px; } .wrap { max-width: 760px; } }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .18s ease-out; } @keyframes rise { from { transform: translateY(24px); } } }
</style>

    if (typeof x !== "string") return;
    const name = x.trim().replace(/\s+/g, " ");
    if (name && !seen.has(name.toLowerCase())) { seen.add(name.toLowerCase()); out.push(name); }
  });
  return out;
}

function pathTo(root, node) {
  const walk = (n, trail) => {
    const here = [...trail, n];
    if (n === node || n.id === node.id) return here;
    for (const c of n.children) { const r = walk(c, here); if (r) return r; }
    return null;
  };
  return walk(root, []);
}

// The instruments that apply to `node`: its own list, else the nearest
// ancestor's, else the piece's. [] means "no instrument named".
function effectiveInstruments(piece, node) {
  const trail = pathTo(piece.root, node) || [node];
  for (let i = trail.length - 1; i >= 0; i--) {
    if (Array.isArray(trail[i].instruments) && trail[i].instruments.length > 0) return trail[i].instruments;
  }
  return Array.isArray(piece.instruments) ? piece.instruments : [];
}

function matchesInstruments(piece, node, selected) {
  const want = normalizeInstruments(selected).map(x => x.toLowerCase());
  if (want.length === 0) return true;
  const have = effectiveInstruments(piece, node);
  if (have.length === 0) return true;
  return have.some(x => want.includes(x.toLowerCase()));
}

// Every instrument named anywhere in these pieces, once each, sorted.
function collectInstruments(pieces) {
  const byKey = new Map();
  const add = list => (list || []).forEach(x => { if (!byKey.has(x.toLowerCase())) byKey.set(x.toLowerCase(), x); });
  pieces.forEach(p => { add(p.instruments); flattenTree(p.root).forEach(n => add(n.instruments)); });
  return [...byKey.values()].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
}

module.exports.normalizeInstruments = normalizeInstruments;
module.exports.effectiveInstruments = effectiveInstruments;
module.exports.matchesInstruments = matchesInstruments;
module.exports.collectInstruments = collectInstruments;

// Why a node deserves special attention, in the player's own words ("what's
// wrong here?" — the prototype's field for it). A node's own note wins. A
// hotspot node with none falls back to the note on the node it was split
// out of, which is where the Anki importer and `decompose <n> <note>` put
// it — so a reason recorded either place shows up where the hotspot is
// actually practised. No new field: hotspotNote already exists on every node.
function effectiveNote(root, node) {
  if (node.hotspotNote) return node.hotspotNote;
  if (node.kind === "hotspot" && node.parentId !== null) {
    const parent = flattenTree(root).find(n => n.id === node.parentId);
    if (parent && parent.hotspotNote) return parent.hotspotNote;
  }
  return "";
}
module.exports.effectiveNote = effectiveNote;
module.exports.mulberry32 = mulberry32;
module.exports.recursiveDecompose = recursiveDecompose;

// =================================================================
// Daily queue simulation
//
// Models processing (auditioning + possibly decomposing) nodes
// under a per-day unit budget. The queue starts with only the root.
//
// A node's total cost is fixed the moment processing on it begins
// (hotspot placement is rolled once, at that moment) — but the cost
// itself no longer has to be paid in one sitting. Each day spends
// whatever budget remains on the node currently in progress; if the
// budget runs out before the node's cost is fully paid, that node
// is PAUSED with its remaining cost recorded, and the next day
// resumes it first, continuing to spend against that same remaining
// cost, before touching anything else. Only once a node's full cost
// has been paid (possibly over several days) does it finalize —
// decomposing into children (enqueued Hotspot, then Child A, then
// Child B) or becoming a leaf.
//
// Everything after the resumed node stays in plain FIFO order: the
// queue's existing front-to-back order already means whatever was
// already waiting ("due") is processed before anything spawned by
// today's own decompositions ("new"), with no separate data
// structure needed for that distinction.
//
// Because any node's cost can now be spread across as many days as
// needed, nothing is ever permanently unprocessable — a very
// expensive node (the root, especially) just takes several days
// instead of stalling. This is the pause/resume mechanic standing
// in for what would really be several distinct practice passes
// before a hotspot's threshold tempo is actually pinned down; the
// per-node cost formula itself is unchanged.
function decomposeCost(total, x) {
  return x + (total - x) * 2;
}

function beginProcessing(node, { minChildLength, placementJitter, rng }) {
  const total = node.end - node.start + 1;
  const midpoint = node.start + Math.floor((total - 1) / 2);
  const offset = Math.floor(rng() * (2 * placementJitter + 1)) - placementJitter;
  const candidateHotspot = midpoint + offset;
  const leftLen = candidateHotspot - node.start;
  const rightLen = node.end - candidateHotspot;
  const willDecompose = leftLen >= minChildLength && rightLen >= minChildLength;
  const totalCost = willDecompose ? decomposeCost(total, leftLen) : total;

  return {
    node,
    total,
    willDecompose,
    hotspot: willDecompose ? candidateHotspot : null,
    totalCost,
    remainingCost: totalCost
  };
}

function finalizeProcessing(state, queue) {
  const { node, willDecompose, hotspot } = state;
  if (willDecompose) {
    node.hotspot = hotspot;
    const children = decompose(node);
    const hotspotChild = children.find(c => c.kind === "hotspot");
    const childA = children.find(c => c.decomposeRank === 1);
    const childB = children.find(c => c.decomposeRank === 2);
    if (hotspotChild) queue.push(hotspotChild);
    if (childA) queue.push(childA);
    if (childB) queue.push(childB);
  } else {
    node.readyForPerformance = true;
  }
}

function simulateDailyQueue(root, options = {}) {
  const {
    dailyBudget,
    minChildLength = 3,
    placementJitter = 1,
    rng = Math.random,
    maxDays = 1000
  } = options;

  if (typeof dailyBudget !== "number" || dailyBudget <= 0) {
    throw new Error("simulateDailyQueue requires a positive dailyBudget.");
  }

  const queue = [root];
  const log = [];
  let inProgress = null;
  let day = 0;

  while ((queue.length > 0 || inProgress) && day < maxDays) {
    day++;
    let remaining = dailyBudget;
    const processedToday = [];

    // Resume yesterday's paused node first, if any.
    if (inProgress) {
      const spend = Math.min(remaining, inProgress.remainingCost);
      remaining -= spend;
      inProgress.remainingCost -= spend;
      const finished = inProgress.remainingCost === 0;
      processedToday.push({
        label: inProgress.node.label, start: inProgress.node.start, end: inProgress.node.end,
        total: inProgress.total, spentToday: spend, remainingCost: inProgress.remainingCost,
        resumed: true, finished
      });
      if (finished) {
        queue.shift(); // the in-progress node has sat at queue[0] the whole time
        finalizeProcessing(inProgress, queue);
        inProgress = null;
      }
    }

    // Then work through the FIFO queue as normal (due items already
    // queued, followed by anything spawned earlier today).
    while (!inProgress && remaining > 0 && queue.length > 0) {
      const node = queue[0];
      const state = beginProcessing(node, { minChildLength, placementJitter, rng });
      const spend = Math.min(remaining, state.remainingCost);
      remaining -= spend;
      state.remainingCost -= spend;
      const finished = state.remainingCost === 0;

      processedToday.push({
        label: node.label, start: node.start, end: node.end, total: state.total,
        spentToday: spend, remainingCost: state.remainingCost,
        resumed: false, finished, decomposed: finished ? state.willDecompose : null
      });

      if (finished) {
        queue.shift();
        finalizeProcessing(state, queue);
      } else {
        inProgress = state; // paused — resumes at the top of tomorrow
      }
    }

    log.push({
      day,
      processed: processedToday,
      unitsUsed: dailyBudget - remaining,
      unitsRemaining: remaining,
      queueLengthAtEnd: queue.length,
      pausedNode: inProgress ? inProgress.node.label : null
    });
  }

  return { log, days: day, queueEmptied: queue.length === 0 && !inProgress };
}

module.exports.decomposeCost = decomposeCost;
module.exports.simulateDailyQueue = simulateDailyQueue;

// =================================================================
// Hotspot tempo-threshold search
//
// A separate concern from the abstract unit-cost simulation above:
// this models the actual trial-by-trial process of finding the
// tempo step at which a node stops holding together, via classic
// binary search over steps, with resumable state for the pause/
// resume flow (see conversation notes — one active search at a
// time, resumed before anything else in the daily cycle).
//
// Search range: -28 to +4 (wider than the -12..+4 practical
// PRACTICE range, since a hotspot may need more than a halving to
// find its actual limit). passStep is the highest step confirmed
// playable; failStep is the lowest step confirmed to break down.
// They start at the extremes and close inward; converged once
// they're adjacent, with passStep as the answer.
//
// Trial semantics (as decided, subject to revision once real data
// exists):
//  - PASS: passStep rises to the tried step. hotspotCandidate is
//    UNCHANGED — the next trial starts from the same location.
//  - FAIL: failStep drops to the tried step, AND hotspotCandidate
//    updates to wherever the breakdown actually occurred this trial
//    (which may differ from where it was expected).
//  - Pausing mid-trial (before it's graded) discards that attempt;
//    resuming re-runs the identical trial (same step, same start
//    location) rather than preserving partial progress within it.
//    This is the simplest option and the one to start with; revisit
//    once it's clear whether that's too wasteful in practice.
//  - A hotspot location that turns out wrong isn't specially
//    guarded against here — it surfaces naturally when the
//    resulting child node is later processed.

const SEARCH_MIN_STEP = -28;
const SEARCH_MAX_STEP = 4;

function beginHotspotSearch(node, options = {}) {
  const {
    minStep = SEARCH_MIN_STEP,
    maxStep = SEARCH_MAX_STEP,
    initialCandidate
  } = options;

  return {
    nodeId: node.id,
    minStep,
    maxStep,
    passStep: minStep,       // assume the floor always plays — nothing confirmed harder yet
    failStep: maxStep + 1,   // sentinel: nothing confirmed to fail yet
    hotspotCandidate: initialCandidate !== undefined
      ? initialCandidate
      : (node.hotspot !== null ? node.hotspot : node.start),
    currentStep: null,
    currentStartLocation: null, // the location actually used for the current trial (may differ from hotspotCandidate; see nextTrial)
    trialInProgress: false,
    history: []              // {step, hotspotCandidate, result, failureLocation?}
  };
}

function isSearchConverged(state) {
  return state.failStep - state.passStep <= 1;
}

// Starts (or re-starts, if paused mid-trial) the next trial. Returns
// the step to attempt and the location to start playing from. The
// very first trial of a search always probes the top of the range
// (maxStep) rather than the midpoint — most nodes aren't actually
// hotspots, and a single pass at maxStep converges the search
// immediately (passStep becomes maxStep, already adjacent to the
// untouched failStep sentinel). A fail there just costs one extra
// trial before normal bisection proceeds from there downward.
//
// startLocationOverride lets a caller choose where THIS ONE trial
// starts playing from without touching hotspotCandidate itself —
// used for resuming from a bookmark, which is just "where I
// happened to be," not a revision of the search's own theory about
// where the problem is. hotspotCandidate only ever moves via an
// actual recorded failure (see recordTrialResult). The resolved
// start location is stashed on the state as currentStartLocation so
// a caller can display what was actually used for this trial, since
// it may differ from hotspotCandidate when an override was given.
function nextTrial(state, startLocationOverride = undefined) {
  if (isSearchConverged(state)) {
    throw new Error("Search has already converged; no further trial is needed.");
  }
  state.currentStep = state.history.length === 0
    ? state.maxStep
    : Math.floor((state.passStep + state.failStep) / 2);
  state.trialInProgress = true;
  state.currentStartLocation = startLocationOverride !== undefined ? startLocationOverride : state.hotspotCandidate;
  return { step: state.currentStep, startLocation: state.currentStartLocation };
}

// Records the outcome of the in-progress trial. A failed trial must
// report where the breakdown occurred, since that becomes the
// updated hotspot candidate.
function recordTrialResult(state, passed, failureLocation = null) {
  if (!state.trialInProgress) {
    throw new Error("No trial is currently in progress.");
  }
  if (!passed && failureLocation === null) {
    throw new Error("A failed trial must report a failureLocation.");
  }

  const entry = { step: state.currentStep, hotspotCandidate: state.hotspotCandidate, result: passed ? "pass" : "fail" };

  if (passed) {
    state.passStep = state.currentStep;
  } else {
    state.failStep = state.currentStep;
    state.hotspotCandidate = failureLocation;
    entry.failureLocation = failureLocation;
  }

  state.trialInProgress = false;
  state.history.push(entry);
  return entry;
}

// Discards an ungraded, in-progress trial. Nothing else changes —
// the next nextTrial() call reproduces the same step and start
// location, since passStep/failStep (the only inputs to the
// midpoint) are untouched.
function pauseSearch(state) {
  state.trialInProgress = false;
}

// Corrects WHERE the most recent failed trial broke down — for the
// moment you typed "fail 88" and then found the real stumble was at 90, or
// the session ran out and the one final attempt was already recorded.
// Only the location changes: the step, the pass/fail result and the
// search's bounds are untouched, so nothing is re-graded. If the next trial
// has already been started from the old candidate, it now starts from the
// corrected one.
function amendLastFailure(state, newLocation) {
  const last = state.history[state.history.length - 1];
  if (!last) throw new Error("Nothing to correct: no trial has been recorded yet.");
  if (last.result !== "fail") throw new Error("Nothing to correct: the last recorded trial was a pass.");
  if (!Number.isInteger(newLocation)) throw new Error("The corrected location must be a whole number.");
  const previous = state.hotspotCandidate;
  last.failureLocation = newLocation;
  state.hotspotCandidate = newLocation;
  if (state.trialInProgress && state.currentStartLocation === previous) state.currentStartLocation = newLocation;
  return { step: last.step, from: previous, to: newLocation };
}

module.exports.SEARCH_MIN_STEP = SEARCH_MIN_STEP;
module.exports.SEARCH_MAX_STEP = SEARCH_MAX_STEP;
module.exports.beginHotspotSearch = beginHotspotSearch;
module.exports.isSearchConverged = isSearchConverged;
module.exports.nextTrial = nextTrial;
module.exports.recordTrialResult = recordTrialResult;
module.exports.pauseSearch = pauseSearch;
module.exports.amendLastFailure = amendLastFailure;

// Concludes a session on a node with an active search: grades it via
// reviewNode, commits step/hotspot from the search state, and — if
// the search converged AND it actually found a genuine hotspot (at
// least one failed trial, not just an immediate pass at maxStep) —
// decomposes the node right then, folding what used to be a separate
// manual step into grading itself. A search that converges having
// never failed (the node was fine near goal tempo all along) leaves
// the node as a leaf; there's nothing to split around. This is keyed
// on "did the search find a real hotspot," not on whether this is
// the node's first exposure — a search paused mid-discovery and
// resumed on a later exposure still triggers decomposition once it
// finally converges, which a strict first-exposure check would miss.
function concludeSession(node, grade, reviewDate = studyDayOf(new Date()), options = {}) {
  if (node.search === null) {
    throw new Error("concludeSession requires an active search on this node.");
  }
  if (node.search.trialInProgress) pauseSearch(node.search);

  const entry = reviewNode(node, grade, reviewDate, options);

  // A node that is already split keeps its children and the hotspot they were
  // split around: re-running its search (a whole-piece review) only moves its
  // tempo step. Whatever the new search found is worked out in the children.
  const alreadySplit = node.children.length > 0;
  node.step = node.search.passStep;
  if (!alreadySplit) node.hotspot = node.search.hotspotCandidate;

  const converged = isSearchConverged(node.search);
  const foundHotspot = node.search.history.some(h => h.result === "fail");

  let decomposedChildren = null;
  if (converged && foundHotspot && node.kind !== "hotspot" && !alreadySplit) {
    decomposedChildren = decompose(node);
  }

  if (converged) node.search = null;

  return { reviewEntry: entry, converged, foundHotspot, decomposedChildren };
}

module.exports.concludeSession = concludeSession;

// =================================================================
// Involuntary session interruption (time ran out) — distinct from
// concludeSession. No grade is assigned and no FSRS scheduling
// happens: the interruption wasn't a decision, so nothing about the
// node's committed step or review history changes. The in-progress
// (ungraded) trial, if any, is discarded the same way pauseSearch
// always discards one — resuming reproduces it identically. The
// node is flagged `interrupted` so it can be given priority pickup
// the next time the player sits down, ahead of ordinary due/new
// nodes, and an optional bookmark records exactly where the player
// physically stopped, which may differ from the search's own
// hotspotCandidate (they might have been partway into a trial, past
// or short of the location the search cares about).
// =================================================================

function interruptSession(node, bookmarkLocation = undefined) {
  if (node.search === null) {
    throw new Error("interruptSession requires an active search on this node.");
  }
  if (node.search.trialInProgress) pauseSearch(node.search);
  node.interrupted = true;
  if (bookmarkLocation !== undefined) node.bookmark = bookmarkLocation;
  return { search: node.search, bookmark: node.bookmark };
}

// Resumes an interrupted node. useBookmark=true plays this one trial
// from the saved bookmark instead of the search's own candidate — a
// practice convenience ("that's where I physically stopped"), not a
// revision of the search's theory about where the problem is.
// hotspotCandidate is deliberately left untouched either way; it
// only ever moves via an actual recorded failure. useBookmark=false
// (the default) resumes from the last potential hotspot as usual.
// Either way, the interrupted flag clears — it only means "needs
// priority pickup," not an ongoing state.
function resumeInterrupted(node, useBookmark = false) {
  if (!node.interrupted) {
    throw new Error("Node is not marked interrupted.");
  }
  if (useBookmark && node.bookmark === null) {
    throw new Error("No bookmark is set for this node.");
  }
  // Start the trial FIRST: nextTrial throws if the search has already
  // converged, and a failed resume must not have already cleared the
  // flag — that would silently drop the node's priority pickup
  // without having resumed anything.
  const trial = useBookmark ? nextTrial(node.search, node.bookmark) : nextTrial(node.search);
  node.interrupted = false;
  return trial;
}

function getInterruptedNodes(root) {
  return flattenTree(root).filter(n => n.interrupted);
}

module.exports.interruptSession = interruptSession;
module.exports.resumeInterrupted = resumeInterrupted;
module.exports.getInterruptedNodes = getInterruptedNodes;

// =================================================================
// Default grade derivation
//
// Bridges the hotspot search to FSRS grading. Grading happens once
// per exposure (one session's worth of engagement with a node —
// whether or not the underlying search converged that session), not
// once per trial. The rule, as decided:
//
//  - Performance-ready is always Easy, regardless of step movement.
//  - First exposure (no prior step to compare against): there's no
//    data to derive a grade from — "when I wanted to see it again"
//    is the reviewer's own intent, not something step history can
//    supply. This returns firstExposureDefault (Good, unless the
//    caller passes something else) rather than silently guessing.
//  - Otherwise, compare currentStep to previousStep (delta = current - previous):
//      reached the top of the range (+4, reserve capacity) -> Easy
//      delta >= +1                                          -> Good
//      delta 0 or -1                                        -> Hard
//      delta <= -2                                          -> Again
//    One step back is within the noise of a single session; two or more is a
//    real slip, and the node is set aside and measured again shortly.
//  - An explicit override (manual choice, or a modifier like an
//    upcoming performance) always wins, ranking above even the
//    performance-ready rule.
//
// currentStep is meant to be the search state's passStep at the
// point the session ends — that value only ever moves up during a
// search, so it's meaningful to grade against even mid-search, not
// just at full convergence.
function deriveGrade({
  isPerformanceReady = false,
  isFirstExposure = false,
  previousStep = null,
  currentStep = null,
  firstExposureDefault = GRADE.GOOD,
  override = null,
  ceilingStep = SEARCH_MAX_STEP
} = {}) {
  if (override !== null) return override;
  if (isPerformanceReady) return GRADE.EASY;
  if (isFirstExposure) return firstExposureDefault;

  if (previousStep === null || currentStep === null) {
    throw new Error("deriveGrade needs both previousStep and currentStep when isFirstExposure is false.");
  }

  if (currentStep >= ceilingStep) return GRADE.EASY;
  const delta = currentStep - previousStep;
  if (delta >= 1) return GRADE.GOOD;
  if (delta >= -1) return GRADE.HARD;
  return GRADE.AGAIN;
}

module.exports.deriveGrade = deriveGrade;

// Computes the suggested grade for a node's active search — the
// integration of deriveGrade with actual search state, so the UI
// has one tested place to call rather than reassembling the inputs
// itself. A search that converged having found NO hotspot (a clean
// pass straight through, which can only happen via an unbroken
// first trial at maxStep) is treated the same as performance-ready
// for this purpose: it demonstrates the same thing — nothing more
// to work on right now — even if the node was never explicitly
// marked ready. That holds regardless of which exposure this is,
// not just the first, since decompose() would already have fired on
// any earlier search that DID find a hotspot, so a leaf can only
// still be searchable on a later exposure if its prior search(es)
// were also clean.
function suggestGrade(node, options = {}) {
  if (node.search === null) {
    throw new Error("suggestGrade requires an active search on this node.");
  }
  const { firstExposureDefault = GRADE.GOOD, override = null } = options;
  const foundHotspot = node.search.history.some(h => h.result === "fail");
  return deriveGrade({
    isPerformanceReady: node.readyForPerformance || !foundHotspot,
    isFirstExposure: node.fsrs === null,
    previousStep: node.step,
    currentStep: node.search.passStep,
    ceilingStep: node.search.maxStep,
    firstExposureDefault,
    override
  });
}

module.exports.suggestGrade = suggestGrade;

// =================================================================
// FSRS-based scheduling
//
// Implements FSRS's core update equations. Grades follow the
// standard 4-point scale: 1 = Again, 2 = Hard, 3 = Good, 4 = Easy.
//
// CAVEAT: the default weights below are the published FSRS-5
// defaults, from memory, and have NOT been cross-checked against a
// reference implementation. The formulas' structural behavior
// (successful review grows stability, Again resets it, difficulty
// stays in [1,10], retrievability decays with elapsed time) is what
// the tests below verify, and that structure is correct regardless
// of small errors in the constants. Before trusting these numbers
// for real scheduling, either diff them against a maintained
// implementation (ts-fsrs, py-fsrs) or run FSRS's own optimizer
// against real review history once enough exists.
// =================================================================

const GRADE = { AGAIN: 1, HARD: 2, GOOD: 3, EASY: 4 };

const FSRS_DEFAULT_PARAMS = [
  0.4072, 1.1829, 3.1262, 15.4722, 7.2102, 0.5316, 1.0651, 0.0234,
  1.616, 0.1544, 1.0824, 1.9813, 0.0953, 0.2975, 2.2042, 0.2407,
  2.9466, 0.5034, 0.6567
];

const DECAY = -0.5;
const FACTOR = 19 / 81; // chosen so retrievability(elapsed = S, S) === 0.9 exactly

function retrievability(elapsedDays, stability) {
  if (stability <= 0) return 0;
  return Math.pow(1 + (FACTOR * elapsedDays) / stability, DECAY);
}

function clampDifficulty(d) {
  return Math.min(10, Math.max(1, d));
}

function initialStability(grade, w = FSRS_DEFAULT_PARAMS) {
  return w[grade - 1];
}

function initialDifficulty(grade, w = FSRS_DEFAULT_PARAMS) {
  return clampDifficulty(w[4] - Math.exp(w[5] * (grade - 1)) + 1);
}

function nextDifficulty(difficulty, grade, w = FSRS_DEFAULT_PARAMS) {
  const meanReversionTarget = initialDifficulty(GRADE.EASY, w);
  const updated = difficulty - w[6] * (grade - 3);
  const reverted = w[7] * meanReversionTarget + (1 - w[7]) * updated;
  return clampDifficulty(reverted);
}

function nextStabilityOnRecall(stability, difficulty, r, grade, w = FSRS_DEFAULT_PARAMS) {
  const hardPenalty = grade === GRADE.HARD ? w[15] : 1;
  const easyBonus = grade === GRADE.EASY ? w[16] : 1;
  const growth =
    Math.exp(w[8]) *
    (11 - difficulty) *
    Math.pow(stability, -w[9]) *
    (Math.exp((1 - r) * w[10]) - 1) *
    hardPenalty *
    easyBonus;
  return stability * (growth + 1);
}

function nextStabilityOnForget(stability, difficulty, r, w = FSRS_DEFAULT_PARAMS) {
  return (
    w[11] *
    Math.pow(difficulty, -w[12]) *
    (Math.pow(stability + 1, w[13]) - 1) *
    Math.exp(w[14] * (1 - r))
  );
}

function nextIntervalDays(stability, requestRetention = 0.9) {
  const days = (stability / FACTOR) * (Math.pow(requestRetention, 1 / DECAY) - 1);
  return Math.max(1, Math.round(days));
}

// --- Two kinds of Date flow through scheduling; keep them apart -------
//
//  1. INSTANTS — a moment in time ("now", an Anki revlog timestamp).
//  2. CALENDAR DATES — a day, with no time zone and no time of day
//     (a card's due date, a review's study day). Represented here as a
//     Date at UTC midnight of that Y-M-D, so addDays/daysBetween are
//     plain UTC arithmetic and immune to DST.
//
// Every scheduling function (reviewNode, concludeSession,

//  - A final "grace" attempt that happens to FINISH the search is
//    graded (with the suggested grade), not deferred. The prototype
//    deferred it, leaving a converged search flagged "interrupted";
//    resuming that throws and strands the node.
//  - Grading a node that was waiting on its final attempt takes it
//    off the waiting list. The prototype left it there, so the
//    session could never finish.
//  - Winding down only sweeps nodes this session actually worked on.
//    The prototype swept every open search in the tree, so a node
//    graded in an earlier session and left alone would be flagged
//    "interrupted" and jump the queue for no reason.
//  - Grading a node clears its interrupted flag (it has now been
//    dealt with), and `endSessionNow` during the wind-down gives up
//    the remaining final attempts instead of leaving the session
//    waiting forever.
//
// Expected, normal refusals (new work while winding down, any action
// after the end) are RETURNED as { refused: "reason", events }, not
// thrown — they're part of the flow, and the events from the clock
// check that preceded them still matter. Calls that make no sense
// (a missing `now`, a bad grade) throw.

const core = require("./sip-core");
const {
  getDueNodes, getInterruptedNodes, daysBetween, dateOnly, effectiveNote,
  beginHotspotSearch, nextTrial, recordTrialResult, isSearchConverged,
  concludeSession, suggestGrade, reviewNode, interruptSession, resumeInterrupted
} = core;

const SESSION_VERSION = 1;
const DEFAULT_SESSION_MINUTES = 25; // one Pomodoro
const RETRY_MINUTES = 10; // an Again node is set aside this long, then comes back to be measured against its new tempo
const GRADE_NAME = { 1: "Again", 2: "Hard", 3: "Good", 4: "Easy" };
const ENDED = "The session has ended.";
const UNFINISHED = "The search isn't finished yet — keep going with pass / fail until it converges (or set it aside with interrupt). A grade comes after the search.";
const WRAPPING_UP = "The session is wrapping up — new work is available next session.";

// ---------------------------------------------------------------
// Small helpers
// ---------------------------------------------------------------

// `now` is a Date or milliseconds. It is always passed in: this module
// has no clock of its own, which is what keeps it portable and testable.
function toMs(now) {
  const ms = now instanceof Date ? now.getTime() : now;
  if (typeof ms !== "number" || !Number.isFinite(ms)) {
    throw new Error("`now` is required, as a Date or milliseconds — the session module never reads the clock itself.");
  }
  return ms;
}

function toDayString(day) {
  const str = day instanceof Date ? dateOnly(day).toISOString().slice(0, 10) : day;
  if (typeof str !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(str) || !new Date(`${str}T00:00:00.000Z`).toISOString().startsWith(str)) {
    throw new Error(`studyDay must be a real calendar day ("YYYY-MM-DD") or a Date, got ${JSON.stringify(day)}.`);
  }
  return str;
}
const dayDate = str => new Date(`${str}T00:00:00.000Z`);

function collectNodes(pieces) {
  const acc = [];
  const walk = n => { acc.push(n); n.children.forEach(walk); };
  pieces.forEach(p => walk(p.root));
  return acc;
}

// A failure location or bookmark must lie inside the node it belongs to.
// Core would accept any integer here, and a typo ("99" on a node covering
// 1-32) would sit quietly until grading, where decompose() throws — after
// reviewNode has already graded the node, leaving it half-updated with a
// hotspot outside its own range (a state the file validator rejects, so
// the piece couldn't even be saved). Stopping it at the door costs nothing.
function assertWithin(node, value, what) {
  if (!Number.isInteger(value) || value < node.start || value > node.end) {
    throw new Error(`${what} must be a whole number inside this node's range (${node.start}–${node.end}), got ${value}.`);
  }
}

function addOnce(list, id) { if (!list.includes(id)) list.push(id); }
function removeId(list, id) { const i = list.indexOf(id); if (i >= 0) list.splice(i, 1); }

// Records an event on the session and in this call's output. `notify`
// marks the ones a person should be told about (as opposed to
// bookkeeping), so a front end needn't know every event type.
function emit(session, out, at, type, node, message, notify, extra) {
  const event = { at, type, nodeId: node ? node.id : null, label: node ? node.label : null, message, notify, ...(extra || {}) };
  session.events.push(event);
  out.push(event);
  return event;
}

// ---------------------------------------------------------------
// Starting a session and reading its clock
// ---------------------------------------------------------------
//
// The session's state, all plain data:
//   startedAt, endsAt   milliseconds
//   minutes             planned length
//   studyDay            "YYYY-MM-DD" — fixed for the whole session, so
//                       every grade in it lands on the same day and
//                       "due today" can't shift mid-session (even if a
//                       session straddles the rollover hour)
//   phase               "active" -> "winding_down" -> "ended"
//   endReason           "timeout" | "manual" | "away" once winding down
//                       ("away": it ran out while SIP was closed — see settleSession)
//   touchedNodeIds      nodes worked on this session
//   gradedNodeIds       nodes graded this session
//   queueOrder          the session's FIFO of waiting nodes, as ids: what
//                       was waiting when it started, in order, with
//                       everything a split spawns since appended to the
//                       END (null until first needed)
//   graceEligibleIds    while winding down: nodes with a trial in
//                       flight, each owed one more Pass/Fail
//   events              everything that happened, in order

// Pass `pieces` to take the queue snapshot immediately; otherwise it's taken
// the first time the queue is read or a node is graded (before anything
// can be split, so it still reflects what was waiting at the start).
//
// softEnd: true makes running out of time a prompt instead of a stop. The
// session stays active (an `overtime` flag and a "time_up" event say so) until
// the player extends it (extendSession) or ends it (endSessionNow, which
// winds down as usual). The default, false, keeps the original hard stop.
function startSession({ now, minutes = DEFAULT_SESSION_MINUTES, studyDay, pieces, softEnd = false, instruments = [] } = {}) {
  const startedAt = toMs(now);
  if (typeof minutes !== "number" || !Number.isFinite(minutes) || minutes <= 0) {
    throw new Error(`A session needs a positive length in minutes, got ${minutes}.`);
  }
  if (studyDay === undefined) {
    throw new Error("A session needs a studyDay — the study day it belongs to (see studyDayOf in sip-core).");
  }
  const session = {
    version: SESSION_VERSION,
    startedAt,
    minutes,
    endsAt: startedAt + Math.round(minutes * 60000),
    studyDay: toDayString(studyDay),
    phase: "active",
    endedAt: null,
    endReason: null,
    touchedNodeIds: [],
    gradedNodeIds: [],
    graceEligibleIds: [],
    retryAt: {},     // node id -> ms: when an Again-graded node comes back this session
    softEnd: softEnd === true,
    overtime: false, // softEnd only: time has run out and the player hasn't decided yet
    reopenedIds: [], // Again-graded nodes picked up again: open work even though they were graded
    instruments: core.normalizeInstruments(instruments), // only work for these instruments (plus untagged work) is queued; [] = everything
    queueOrder: null,
    events: []
  };
  emit(session, [], startedAt, "session_started", null, `Started a ${minutes}-minute practice session.`, false);
  if (pieces) snapshotQueueOrder(session, pieces);
  return session;
}

// A read-only look at the clock. It never changes the session — that's
// tickSession's job — so it's safe to call as often as a display needs.
function sessionClock(session, now) {
  const t = toMs(now);
  return {
    phase: session.phase,
    remainingMs: session.phase === "active" ? Math.max(0, session.endsAt - t) : 0,
    elapsedMs: Math.max(0, t - session.startedAt),
    timeIsUp: session.phase !== "active" || t >= session.endsAt,
    overtimeMs: session.phase === "active" ? Math.max(0, t - session.endsAt) : 0,
    soft: session.softEnd === true
  };
}

// ---------------------------------------------------------------
// Winding down
// ---------------------------------------------------------------

function finishIfDone(session, t, out) {
  if (session.phase === "winding_down" && session.graceEligibleIds.length === 0) {
    session.phase = "ended";
    session.endedAt = t;
    emit(session, out, t, "session_ended", null, "Session ended.", true);
  }
}

function autoGrade(session, node, t, out, why) {
  const grade = suggestGrade(node);
  const result = concludeSession(node, grade, dayDate(session.studyDay));
  appendSpawned(session, result.decomposedChildren);
  node.interrupted = false;
  addOnce(session.gradedNodeIds, node.id);
  removeId(reopenedList(session), node.id);
  emit(session, out, t, "auto_graded", node,
    `${node.label}: ${why} — auto-graded ${GRADE_NAME[grade]}${result.decomposedChildren ? ", and split around its hotspot" : ""}.`,
    true, { grade, decomposed: result.decomposedChildren !== null });
  return result;
}

function deferInternal(session, node, bookmark, t, out, why) {
  interruptSession(node, bookmark);
  emit(session, out, t, "deferred", node,
    `${node.label}: ${why ? why + " — " : ""}saved, no grade assigned${bookmark !== undefined ? ` — bookmarked @ ${bookmark}` : ""}. It will come up first next session.`,
    true, { bookmark: node.bookmark });
}

// What happens when time is up (or the player ends the session):
//  - a node with a trial in flight is owed exactly one more Pass/Fail —
//    a real stopping point, not an arbitrary cutoff;
//  - a search that had already converged has nothing left to lose, so
//    it's graded with the suggested grade;
//  - any other open search is deferred on the spot (no grade, flagged
//    for priority pickup).
// Only nodes worked on THIS session are touched; everything else is
// left exactly as it was.
// A session that was saved while SIP was open can come back after its time
// has run out. Nobody was there to play, so nothing "in flight" is a real
// attempt any more: this winds the session down the way running out of time
// does, but gives up the final attempts instead of offering them. A session
// that still has time left is untouched and simply carries on (its clock is
// absolute, so the minutes spent away count against it). Returns the events.
function settleSession(session, pieces, { now } = {}) {
  const t = toMs(now);
  if (session.phase === "ended") return [];
  const expired = session.phase === "winding_down" || t >= session.endsAt;
  if (!expired) return [];
  const events = [];
  emit(session, events, t, "session_expired_while_away", null,
    "This session ran out while SIP was closed — nothing was in play, so no final attempt is offered.", true);
  if (session.phase === "active") {
    events.push(...beginWindDown(session, pieces, t, "away"));     // never offers a final attempt
  } else {
    events.push(...endSessionNow(session, pieces, { now: t }));    // saved mid-wrap-up: give up the attempt it was waiting on
  }
  session.graceEligibleIds = []; // ids of nodes that no longer exist can't be owed an attempt
  return events;
}

function beginWindDown(session, pieces, t, reason) {
  const out = [];
  snapshotQueueOrder(session, pieces); // before auto-grading can split anything
  session.phase = "winding_down";
  session.endReason = reason;
  const away = reason === "away";   // nobody is there to play: say nothing extra, offer no final attempt
  emit(session, out, t, "wind_down_started", null, reason === "timeout" ? "Time's up." : "Ending the session.", !away, { reason });

  const touched = new Set(session.touchedNodeIds);
  const graded = new Set(session.gradedNodeIds);
  const reopened = new Set(reopenedList(session));
  const open = collectNodes(pieces).filter(n => touched.has(n.id) && n.search !== null && !n.interrupted && (!graded.has(n.id) || reopened.has(n.id)));

  session.graceEligibleIds = away ? [] : open.filter(n => n.search.trialInProgress).map(n => n.id);
  open.forEach(n => {
    if (away && n.search.trialInProgress) {
      deferInternal(session, n, undefined, t, out, "was mid-attempt when SIP was closed");
    } else if (session.graceEligibleIds.includes(n.id)) {
      emit(session, out, t, "grace_offered", n,
        `${n.label}: finish this attempt if you like — one more Pass/Fail is allowed — then it's saved for next time.`, true);
    } else if (isSearchConverged(n.search)) {
      autoGrade(session, n, t, out, "had already converged");
    } else {
      deferInternal(session, n, undefined, t, out, "wasn't mid-attempt");
    }
  });

  finishIfDone(session, t, out);
  return out;
}

// Checks the clock and, if time has run out, starts winding down.
// Idempotent. Every action below calls this first, so nothing can
// slip past the deadline just because nobody polled in time. Returns
// the events it caused.
function tickSession(session, pieces, { now } = {}) {
  const t = toMs(now);
  if (session.phase === "active" && t >= session.endsAt) {
    if (session.softEnd === true) {
      if (session.overtime) return [];
      session.overtime = true;
      const out = [];
      emit(session, out, t, "time_up", null, "Time's up. Extend 5 minutes, or end the session.", true);
      return out;
    }
    return beginWindDown(session, pieces, t, "timeout");
  }
  return [];
}

// "Keep going": gives a running session more time. The new minutes count from
// now if the time had already run out. Returns { events } or { refused, events }.
function extendSession(session, pieces, { now, minutes = 5 } = {}) {
  const t = toMs(now);
  if (typeof minutes !== "number" || !Number.isFinite(minutes) || minutes <= 0) throw new Error(`Extending needs a positive number of minutes, got ${minutes}.`);
  const events = tickSession(session, pieces, { now: t });
  if (session.phase !== "active") return { refused: session.phase === "ended" ? ENDED : WRAPPING_UP, events };
  session.endsAt = Math.max(session.endsAt, t) + Math.round(minutes * 60000);
  session.minutes += minutes;
  session.overtime = false;
  emit(session, events, t, "extended", null, `Extended by ${minutes} minute${minutes === 1 ? "" : "s"}.`, false, { minutes });
  return { events };
}

// "End session now" — the same road as a timeout. During the wind-down
// itself it means "I'm done": the final attempts still owed are given
// up (those nodes are deferred, no grade) so the session can finish.
function endSessionNow(session, pieces, { now } = {}) {
  const t = toMs(now);
  const events = tickSession(session, pieces, { now: t });
  if (session.phase === "active") {
    events.push(...beginWindDown(session, pieces, t, "manual"));
  } else if (session.phase === "winding_down") {
    const waiting = collectNodes(pieces).filter(n => session.graceEligibleIds.includes(n.id));
    waiting.forEach(n => deferInternal(session, n, undefined, t, events, "stopped before its final attempt"));
    session.graceEligibleIds = [];
    finishIfDone(session, t, events);
  }
  return events;
}

// ---------------------------------------------------------------
// What to work on
// ---------------------------------------------------------------

// The order work is offered in.
//
//  1. Interrupted nodes first — cut off mid-practice, so picked up before
//     anything else — across all pieces.
//  2. Then each piece's waiting nodes: never-reviewed ones first, then
//     reviewed ones by how overdue they are. Pieces are interleaved
//     round-robin, so a session spreads over the repertoire instead of
//     exhausting the first piece before touching the second.
//
// WITHIN a piece, never-reviewed nodes come out breadth-first: level by
// level, and within a level Hotspot, then Child A, then Child B. That is
// the order a queue fills in when every decomposition appends its three
// children to the END and work is taken from the FRONT (the original
// design — see simulateDailyQueue). It matters: a Child B that was already
// waiting is reached BEFORE the pieces Child A splits into, instead of
// starving until Child A's whole subtree is done. (getDueNodes, which this
// uses only to decide WHAT is due, sorts by rank across the whole tree —
// every hotspot at any depth ahead of every Child B — which is not this.)
//
// Decomposed parents are queued too; they come around on their own
// schedule and are graded directly, without a search.
function breadthFirstIndex(root) {
  const rank = n => (n.decomposeRank === null ? 3 : n.decomposeRank);
  const index = new Map();
  const frontier = [root];
  for (let i = 0; i < frontier.length; i++) {
    index.set(frontier[i].id, i);
    [...frontier[i].children].sort((x, y) => rank(x) - rank(y)).forEach(c => frontier.push(c));
  }
  return index;
}

function interleave(lists) {
  const out = [];
  const longest = Math.max(0, ...lists.map(l => l.length));
  for (let i = 0; i < longest; i++) lists.forEach(l => { if (i < l.length) out.push(l[i]); });
  return out;
}

// Sessions saved before retries existed have no retryAt map.
function retryMap(session) {
  if (!session.retryAt) session.retryAt = {};
  return session.retryAt;
}
function reopenedList(session) {
  if (!session.reopenedIds) session.reopenedIds = [];
  return session.reopenedIds;
}

function buildQueue(pieces, studyDay, { excludeIds = [], instruments = [] } = {}) {
  const day = dayDate(toDayString(studyDay));
  const excluded = new Set(excludeIds);
  const entry = (piece, node, status) => ({
    piece, node, status,
    daysOverdue: status === "due" ? daysBetween(node.fsrs.due, day) : null,
    bookmark: node.bookmark,
    hasChildren: node.children.length > 0,
    converged: node.search !== null && isSearchConverged(node.search),
    note: effectiveNote(piece.root, node)
  });

  const interrupted = [];
  const waitingDue = [];
  const waitingNew = [];
  pieces.forEach(piece => {
    const order = breadthFirstIndex(piece.root);
    const bySpawnOrder = (a, b) => order.get(a.id) - order.get(b.id);

    const wanted = n => core.matchesInstruments(piece, n, instruments);
    getInterruptedNodes(piece.root).filter(n => !excluded.has(n.id) && wanted(n)).sort(bySpawnOrder)
      .forEach(n => interrupted.push(entry(piece, n, "interrupted")));

    const due = getDueNodes(piece.root, day).filter(n => !n.interrupted && !excluded.has(n.id) && wanted(n));
    const fresh = due.filter(n => n.fsrs === null).sort(bySpawnOrder);
    const reviewed = due.filter(n => n.fsrs !== null).sort((a, b) => (a.fsrs.due - b.fsrs.due) || bySpawnOrder(a, b));
    waitingDue.push(reviewed.map(n => entry(piece, n, "due")));
    waitingNew.push(fresh.map(n => entry(piece, n, "new")));
  });
  // Reviews that have come due go before anything never practised, across all pieces.
  return [...interrupted, ...interleave(waitingDue), ...interleave(waitingNew)];
}

// The queue for a running session — nodes already graded this session
// don't come back around within it.
// buildQueue says what is waiting and in what order a FRESH queue would be
// laid out. A running session needs more than that: it needs a queue with
// memory, because the order is about WHEN things joined. Piece #1's root is
// graded and splits: its Hotspot / Child A / Child B join the queue NOW, so
// they belong behind Piece #2's root, which was already waiting — not ahead
// of it just because, rebuilt from scratch, they'd sit at the front of their
// own piece's list. (The same rule inside a piece: a Child B already waiting
// is reached before the pieces Child A splits into.)
//
// So the session keeps its own FIFO (`queueOrder`, ids): a snapshot of what
// was waiting when it began, with every node a split spawns appended to the
// end, in Hotspot / Child A / Child B order. Interrupted nodes are a
// separate priority lane at the front. Anything waiting that the FIFO
// doesn't know (the piece was edited outside the runner mid-session) is
// appended in the order a fresh queue would give it.
function snapshotQueueOrder(session, pieces) {
  if (session.queueOrder === null) {
    session.queueOrder = buildQueue(pieces, session.studyDay, { excludeIds: session.gradedNodeIds, instruments: session.instruments }).map(e => e.node.id);
  }
}

function appendSpawned(session, children) {
  if (!children || session.queueOrder === null) return;
  const rank = n => (n.decomposeRank === null ? 3 : n.decomposeRank);
  [...children].sort((a, b) => rank(a) - rank(b)).forEach(c => {
    if (!session.queueOrder.includes(c.id)) session.queueOrder.push(c.id);
  });
}

// Nodes graded Again this session come back once RETRY_MINUTES have passed
// (pass `now`; without it every retry counts as ready). A ready retry goes
// right after any interrupted work; one that isn't ready yet is held back —
// unless nothing else is waiting, so the player is never left with an empty
// queue while a retry is only minutes away. Retry entries carry status
// "retry", `retryAt` (ms) and `waitMs` (how much longer it is being held).
function sessionQueue(session, pieces, { now } = {}) {
  snapshotQueueOrder(session, pieces);
  const fresh = buildQueue(pieces, session.studyDay, { excludeIds: session.gradedNodeIds, instruments: session.instruments });
  const position = new Map(session.queueOrder.map((id, i) => [id, i]));
  const interrupted = fresh.filter(e => e.status === "interrupted");
  const rest = fresh.filter(e => e.status !== "interrupted");
  const remembered = rest.filter(e => position.has(e.node.id)).sort((a, b) => position.get(a.node.id) - position.get(b.node.id));
  const unknown = rest.filter(e => !position.has(e.node.id));

  const t = now === undefined ? null : toMs(now);
  const retries = [];
  const pending = session.phase === "ended" ? {} : retryMap(session); // nothing comes back once the session is over
  pieces.forEach(piece => {
    const walk = n => {
      if (pending[n.id] !== undefined && session.gradedNodeIds.includes(n.id) && core.matchesInstruments(piece, n, session.instruments)) {
        const waitMs = t === null ? 0 : Math.max(0, pending[n.id] - t);
        retries.push({
          piece, node: n, status: "retry", daysOverdue: null, bookmark: n.bookmark,
          hasChildren: n.children.length > 0,
          converged: n.search !== null && isSearchConverged(n.search),
          note: effectiveNote(piece.root, n), retryAt: pending[n.id], waitMs
        });
      }
      n.children.forEach(walk);
    };
    walk(piece.root);
  });
  retries.sort((a, b) => a.retryAt - b.retryAt);
  const ready = retries.filter(e => e.waitMs === 0);
  const held = retries.filter(e => e.waitMs > 0);
  const queue = [...interrupted, ...ready, ...remembered, ...unknown];
  return queue.length === 0 ? held : queue;
}


// How much work is waiting that this session's instrument choice is hiding.
// The queue screen says so ("3 more for other instruments") so nothing seems lost.
function hiddenByInstruments(session, pieces) {
  const all = buildQueue(pieces, session.studyDay, { excludeIds: session.gradedNodeIds }).length;
  const shown = buildQueue(pieces, session.studyDay, { excludeIds: session.gradedNodeIds, instruments: session.instruments }).length;
  return all - shown;
}

// ---------------------------------------------------------------
// Working on a node
// ---------------------------------------------------------------

function touch(session, node) { addOnce(session.touchedNodeIds, node.id); }

// Picks a node up. Returns { mode, trial, events }:
//   "search"    a hotspot search is running; `trial` is the attempt to play
//   "resumed"   an interrupted search was resumed — from its bookmark if it
//               has one, else its own hotspot candidate (resume: "auto", the
//               default); resume: "bookmark" / "hotspot" forces either
//               (a decomposed parent gets one too: it is played through whole
//               and its tempo step is re-measured)
//   "converged" the search is already finished; it just needs a grade
// or { refused, events } if the session is winding down or over.
function startNodeWork(session, pieces, node, { now, resume = "auto" } = {}) {
  const t = toMs(now);
  if (resume !== "auto" && resume !== "hotspot" && resume !== "bookmark") throw new Error('resume must be "auto", "hotspot" or "bookmark".');
  const events = tickSession(session, pieces, { now: t });
  if (session.phase === "ended") return { refused: ENDED, events };
  if (session.phase === "winding_down") return { refused: WRAPPING_UP, events };

  touch(session, node);
  const pendingRetry = retryMap(session);
  if (pendingRetry[node.id] !== undefined) { // an Again node coming back: it is open work again
    delete pendingRetry[node.id];
    addOnce(reopenedList(session), node.id);
  }
  const started = (mode, trial) => {
    emit(session, events, t, "work_started", node, `${node.label}: ${mode}.`, false, { mode });
    return { mode, trial, events };
  };

  if (node.interrupted) {
    if (node.search !== null && isSearchConverged(node.search)) {
      node.interrupted = false; // nothing left to resume: it only needs its grade
      return started("converged", null);
    }
    // "auto": where the player physically stopped, if they said so; otherwise the
    // search's own hotspot candidate. Either can still be forced by name.
    const useBookmark = resume === "bookmark" || (resume === "auto" && node.bookmark !== null);
    return started("resumed", resumeInterrupted(node, useBookmark));
  }
  if (node.search !== null) {
    if (isSearchConverged(node.search)) return started("converged", null);
    const trial = node.search.trialInProgress
      ? { step: node.search.currentStep, startLocation: node.search.currentStartLocation }
      : nextTrial(node.search);
    return started("search", trial);
  }
  // A node that is already split is searched again like any other: the player
  // plays it through from the top, finds a new candidate if one breaks, and works
  // out the tempo it holds now. The candidate starts at the node's first measure
  // (not at the hotspot it was split around) because it may have moved.
  node.search = beginHotspotSearch(node, node.children.length > 0 ? { initialCandidate: node.start } : {});
  return started("search", nextTrial(node.search));
}

// Records the result of the trial in flight. While winding down, a node
// owed its final attempt gets exactly this one: afterwards it's
// deferred (optionally bookmarked where the player physically stopped)
// — or graded, if that attempt happened to finish the search.
